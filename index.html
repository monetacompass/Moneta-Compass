<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moneta Compass</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root{
    --paper: #EDE8DC;
    --paper-line: #CFC6B0;
    --ink: #22281F;
    --ink-soft: #5C5F52;
    --moss: #55694A;
    --rust: #A8462F;
    --card: #F6F3EA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family: "Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
    min-height:100vh;
  }
  .wrap{ max-width:480px; margin:0 auto; padding:28px 20px 110px; position:relative; transition:max-width 0.2s; }
  @media (min-width:720px){ .wrap{ max-width:760px; padding:40px 32px 110px; } }
  @media (min-width:1080px){ .wrap{ max-width:1040px; padding:48px 40px 110px; } }
  .masthead{
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:2px solid var(--ink); padding-bottom:10px; margin-bottom:22px; min-height:30px;
  }
  .masthead h1{ font-size:22px; font-weight:600; letter-spacing:0.3px; margin:0; display:flex; align-items:center; gap:10px; }
  .back-btn{ background:none; border:none; font-family:inherit; font-size:20px; color:var(--ink); cursor:pointer; padding:0; line-height:1; }
  .navlinks{ display:flex; align-items:center; gap:8px; }
  .navlink{
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:11.5px; color:var(--ink-soft);
    background:none; border:none; cursor:pointer; text-decoration:underline; text-underline-offset:3px; padding:0; white-space:nowrap;
  }
  .navsep{ color:var(--paper-line); font-size:11px; }

  /* ---- Auth view ---- */
  .login-intro{ font-size:15px; line-height:1.55; color:var(--ink-soft); margin:0 0 22px; }
  .auth-tabs{ display:flex; gap:6px; margin-bottom:18px; }
  .auth-tab{
    flex:1; padding:9px; text-align:center; background:var(--card); border:1px solid var(--paper-line);
    font-family:inherit; font-size:13.5px; color:var(--ink-soft); cursor:pointer; border-radius:2px;
  }
  .auth-tab.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .login-error{ font-size:12.5px; color:var(--rust); margin:8px 0 0; min-height:16px; }
  .login-msg{ font-size:13px; color:var(--moss); margin:8px 0 0; min-height:16px; }
  .login-note{
    font-size:12px; color:var(--ink-soft); line-height:1.5; margin-top:18px;
    padding-top:14px; border-top:1px solid var(--paper-line);
  }

  /* ---- Home / hero view ---- */
  .hero-eyebrow{ font-size:14px; color:var(--ink-soft); margin-bottom:6px; }
  .hero-headline{ font-size:30px; line-height:1.22; font-weight:600; letter-spacing:-0.2px; margin:0 0 14px; }
  .hero-body{ font-size:15.5px; line-height:1.55; color:var(--ink-soft); margin:0 0 22px; max-width:60ch; }
  .hero-stat{
    background:var(--card); border:1px solid var(--paper-line); border-radius:2px;
    padding:14px 16px; margin-bottom:26px; display:flex; align-items:baseline; justify-content:space-between;
  }
  .hero-stat .label{ font-size:12px; color:var(--ink-soft); }
  .hero-stat .value{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:20px; }
  .tip-row{ display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--paper-line); }
  .tip-row .dot{ width:8px; height:8px; border-radius:50%; margin-top:7px; flex-shrink:0; background:var(--moss); }
  .tip-title{ font-size:15.5px; margin-bottom:2px; }
  .tip-body{ font-size:13.5px; color:var(--ink-soft); line-height:1.5; }
  .cta{
    display:block; width:100%; text-align:center; margin-top:28px; padding:14px;
    background:var(--ink); color:var(--paper); border:none; font-family:inherit;
    font-size:15px; font-weight:600; border-radius:2px; cursor:pointer;
  }

  /* ---- Months list view ---- */
  .month-card{ display:flex; align-items:center; justify-content:space-between; padding:16px 4px; border-bottom:1px solid var(--paper-line); cursor:pointer; }
  .month-card:hover .month-name{ color:var(--moss); }
  .month-name{ font-size:17px; }
  .month-meta{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .month-amount{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:18px; }
  .chev{ color:var(--ink-soft); margin-left:10px; font-size:14px; }
  .month-row-right{ display:flex; align-items:center; }

  .empty{ text-align:center; color:var(--ink-soft); font-size:14px; padding:40px 10px; border:1px dashed var(--paper-line); border-radius:2px; margin-top:10px; }
  .loading{ text-align:center; color:var(--ink-soft); font-size:13px; padding:20px; }

  /* ---- Month detail view ---- */
  .total-block{ margin-bottom:26px; }
  .total-label{ font-size:12px; color:var(--ink-soft); margin-bottom:2px; }
  .total-amount{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:38px; font-weight:600; line-height:1; letter-spacing:-0.5px; }
  .section-label{ font-size:12px; color:var(--ink-soft); margin: 22px 0 8px; padding-bottom:6px; border-bottom:1px solid var(--paper-line); }
  .day-heading{ font-size:12px; color:var(--ink-soft); margin:16px 0 4px; }
  .entry-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--paper-line); }
  .entry-row .dot{ width:8px;height:8px;border-radius:50%; flex-shrink:0; }
  .entry-info{ flex:1; min-width:0; }
  .entry-cat{ font-size:14.5px; display:flex; align-items:center; gap:6px; }
  .recur-badge{ font-size:11px; color:var(--ink-soft); }
  .entry-note{ font-size:12px; color:var(--ink-soft); }
  .entry-amount{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:15px; white-space:nowrap; }
  .entry-del{ background:none; border:none; color:var(--ink-soft); font-size:16px; cursor:pointer; padding:4px 2px; line-height:1; }
  .entry-del:hover{ color:var(--rust); }

  /* ---- Recurring page ---- */
  .recur-card{ padding:14px 4px; border-bottom:1px solid var(--paper-line); display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .recur-name{ font-size:15.5px; }
  .recur-meta{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .recur-amount{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:15px; margin-right:8px; }
  .stop-btn{
    background:transparent; border:1px solid var(--paper-line); color:var(--ink-soft);
    font-family:inherit; font-size:11.5px; padding:6px 10px; border-radius:2px; cursor:pointer; white-space:nowrap;
  }
  .stop-btn:hover{ border-color:var(--rust); color:var(--rust); }

  /* ---- Watchlist page ---- */
  .add-symbol-row{ display:flex; gap:8px; margin-bottom:18px; }
  .add-symbol-row input{ text-transform:uppercase; }
  .add-symbol-row button{
    flex:0 0 auto; padding:0 16px; background:var(--ink); color:var(--paper); border:none;
    font-family:inherit; font-size:14px; font-weight:600; border-radius:2px; cursor:pointer;
  }
  .add-symbol-row button:disabled{ opacity:0.5; cursor:default; }
  .stock-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 4px; border-bottom:1px solid var(--paper-line);
  }
  .stock-symbol{ font-size:16px; font-weight:600; }
  .stock-meta{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .stock-right{ display:flex; align-items:center; gap:10px; }
  .stock-price{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:16px; text-align:right; }
  .stock-change{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:12.5px; text-align:right; }
  .stock-change.up{ color:var(--moss); }
  .stock-change.down{ color:var(--rust); }
  .stock-del{ background:none; border:none; color:var(--ink-soft); font-size:15px; cursor:pointer; padding:2px 4px; }
  .stock-del:hover{ color:var(--rust); }
  .refresh-link{ font-size:12px; }

  /* ---- Portfolio page ---- */
  .holding-row{
    padding:14px 4px; border-bottom:1px solid var(--paper-line);
    display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer;
  }
  .holding-symbol{ font-size:16px; font-weight:600; }
  .holding-meta{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .holding-value{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:16px; text-align:right; }
  .holding-gain{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:12.5px; text-align:right; }
  .holding-gain.up{ color:var(--moss); }
  .holding-gain.down{ color:var(--rust); }
  .portfolio-total{
    background:var(--card); border:1px solid var(--paper-line); border-radius:2px;
    padding:16px; margin-bottom:20px;
  }
  .portfolio-total .label{ font-size:12px; color:var(--ink-soft); }
  .portfolio-total .value{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:30px; margin-top:2px; }
  .portfolio-total .sub{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:13px; margin-top:4px; }

  /* ---- Stock detail page ---- */
  .detail-price-block{ margin-bottom:22px; }
  .detail-price{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:36px; font-weight:600; }
  .detail-change{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:15px; margin-top:2px; }
  .metric-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:22px;
  }
  .metric-box{ background:var(--card); border:1px solid var(--paper-line); border-radius:2px; padding:12px 14px; }
  .metric-label{ font-size:11px; color:var(--ink-soft); margin-bottom:3px; }
  .metric-value{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:16px; }
  .range-bar{
    position:relative; height:8px; background:var(--paper-line); border-radius:4px; margin:8px 0 4px;
  }
  .range-fill{ position:absolute; top:-3px; width:14px; height:14px; border-radius:50%; background:var(--ink); transform:translateX(-50%); }
  .range-labels{ display:flex; justify-content:space-between; font-size:11px; color:var(--ink-soft); }
  .earnings-row{ padding:12px 4px; border-bottom:1px solid var(--paper-line); }
  .earnings-label{ font-size:12px; color:var(--ink-soft); margin-bottom:2px; }
  .earnings-value{ font-size:15px; }
  .beat{ color:var(--moss); } .miss{ color:var(--rust); }

  /* ---- Budget progress ---- */
  .budget-row{ padding:10px 0; }
  .budget-top{ display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:5px; }
  .budget-track{ height:8px; background:var(--paper-line); border-radius:4px; overflow:hidden; }
  .budget-fill{ height:100%; border-radius:4px; }
  .budget-fill.ok{ background:var(--moss); }
  .budget-fill.over{ background:var(--rust); }

  /* ---- Dashboard tiles (home page) ---- */
  .dashboard-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin:20px 0 28px;
  }
  @media (min-width:600px){ .dashboard-grid{ grid-template-columns:repeat(3,1fr); } }
  @media (min-width:1080px){ .dashboard-grid{ grid-template-columns:repeat(5,1fr); } }
  .dashboard-tile{
    background:var(--card); border:1px solid var(--paper-line); border-radius:4px;
    padding:20px 14px; text-align:center; cursor:pointer; transition:border-color 0.15s;
  }
  .dashboard-tile:hover{ border-color:var(--moss); }
  .dashboard-tile .tile-icon{ font-size:26px; margin-bottom:8px; display:block; }
  .dashboard-tile .tile-label{ font-size:13.5px; font-weight:600; }
  .dashboard-tile .tile-sub{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }

  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:24px; }
  @media (min-width:600px){ .stat-grid{ grid-template-columns:repeat(3,1fr); } }
  .stat-card{ background:var(--card); border:1px solid var(--paper-line); border-radius:2px; padding:14px 16px; }
  .stat-card .label{ font-size:11.5px; color:var(--ink-soft); }
  .stat-card .value{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:20px; margin-top:3px; }

  @media (min-width:720px){
    .hero-headline{ font-size:36px; }
    .hero-body{ max-width:70ch; }
  }

  /* ---- Net worth page ---- */
  .networth-summary{
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:24px;
  }
  @media (max-width:600px){ .networth-summary{ grid-template-columns:1fr; } }
  .nw-card{ background:var(--card); border:1px solid var(--paper-line); border-radius:2px; padding:14px 16px; }
  .nw-card.highlight{ background:var(--ink); border-color:var(--ink); }
  .nw-card.highlight .label{ color:#c9c4b5; }
  .nw-card.highlight .value{ color:var(--paper); }
  .nw-card .label{ font-size:11.5px; color:var(--ink-soft); }
  .nw-card .value{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:22px; margin-top:3px; }
  .nw-item-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 4px; border-bottom:1px solid var(--paper-line);
  }
  .nw-item-label{ font-size:14.5px; }
  .nw-item-balance{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:15px; }

  /* ---- Donut charts ---- */
  .charts-row{ display:flex; flex-wrap:wrap; gap:24px; margin-bottom:24px; }
  .chart-block{ flex:1; min-width:220px; }
  .chart-block-inner{ display:flex; align-items:center; gap:18px; }
  .chart-title{ font-size:12px; color:var(--ink-soft); margin-bottom:10px; }
  .chart-center-label{ text-align:center; }
  .legend-list{ flex:1; min-width:0; }
  .legend-row{ display:flex; align-items:center; gap:8px; padding:5px 0; font-size:12.5px; }
  .legend-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .legend-label{ flex:1; color:var(--ink); }
  .legend-value{ color:var(--ink-soft); font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:11.5px; white-space:nowrap; }

  /* ---- Floating add button ---- */
  .fab{
    position:fixed; right:calc(50% - 240px + 20px); bottom:26px;
    background:var(--ink); color:var(--paper); border:none; border-radius:999px;
    height:52px; padding:0 22px; font-size:15px; font-weight:600; font-family:inherit; cursor:pointer;
    box-shadow:0 4px 14px rgba(34,40,31,0.35);
    display:flex; align-items:center; gap:8px;
  }
  .fab .fab-icon{ font-size:19px; line-height:1; }
  @media (max-width: 520px){ .fab{ right:20px; } }
  @media (min-width:720px){ .fab{ right:calc(50% - 380px + 20px); } }
  @media (min-width:1080px){ .fab{ right:calc(50% - 520px + 20px); } }
  html[dir="rtl"] .fab{ right:auto; left:calc(50% - 240px + 20px); }
  @media (max-width: 520px){ html[dir="rtl"] .fab{ left:20px; } }
  @media (min-width:720px){ html[dir="rtl"] .fab{ left:calc(50% - 380px + 20px); } }
  @media (min-width:1080px){ html[dir="rtl"] .fab{ left:calc(50% - 520px + 20px); } }

  /* ---- Modal ---- */
  .backdrop{ position:fixed; inset:0; background:rgba(34,40,31,0.45); display:none; align-items:flex-end; justify-content:center; z-index:10; }
  .backdrop.open{ display:flex; }
  .modal{ background:var(--card); width:100%; max-width:480px; border-radius:10px 10px 0 0; padding:20px 20px 24px; border-top:1px solid var(--paper-line); max-height:90vh; overflow-y:auto; }
  .modal h2{ font-size:17px; margin:0 0 14px; }
  .row{ display:flex; gap:10px; margin-bottom:10px; }
  .row:last-of-type{ margin-bottom:0; }
  .field{ flex:1; display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:11px; color:var(--ink-soft); }
  input, select{
    font-family:inherit; font-size:15px; padding:8px 9px; border:1px solid var(--paper-line);
    background:#fff; color:var(--ink); border-radius:2px; width:100%;
  }
  input:focus, select:focus{ outline:2px solid var(--moss); outline-offset:-1px; }
  .amount-field input{ font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .checkbox-row{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .checkbox-row input{ width:auto; }
  .checkbox-row label{ font-size:13.5px; color:var(--ink); }
  .receipt-row{ margin:0 0 14px; padding:12px; border:1px dashed var(--paper-line); background:#fffdf7; border-radius:2px; }
  .receipt-row button{ width:100%; padding:10px; background:transparent; color:var(--ink); border:1px solid var(--paper-line); font-family:inherit; font-size:13.5px; border-radius:2px; cursor:pointer; }
  .receipt-row input{ margin-top:8px; }
  .receipt-status{ font-size:12px; color:var(--ink-soft); line-height:1.45; margin-top:8px; min-height:18px; }
  .receipt-preview{ display:none; width:100%; max-height:180px; object-fit:contain; margin-top:8px; border:1px solid var(--paper-line); background:#f5f5f5; }
  .receipt-preview.show{ display:block; }
  .modal-actions{ display:flex; gap:10px; margin-top:16px; }
  button.add{ flex:1; padding:11px; background:var(--ink); color:var(--paper); border:none; font-family:inherit; font-size:14px; font-weight:600; border-radius:2px; cursor:pointer; }
  button.add:disabled{ opacity:0.5; cursor:default; }
  button.cancel{ flex:0 0 90px; padding:11px; background:transparent; color:var(--ink-soft); border:1px solid var(--paper-line); font-family:inherit; font-size:14px; border-radius:2px; cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead" id="masthead">
    <div style="display:flex;align-items:center;gap:10px;">
      <button id="homeBtn" class="back-btn" aria-label="Home" style="display:none;font-size:20px;">🏠</button>
      <h1 id="pageTitle">Moneta Compass</h1>
    </div>
    <div id="pageSub"></div>
  </div>
  <div id="mainArea"><div class="loading">Loading…</div></div>
  <button class="fab" id="fabAdd" aria-label="Add expense or income" style="display:none;"><span class="fab-icon">✎</span><span>Add</span></button>
</div>

<div class="backdrop" id="backdrop">
  <div class="modal">
    <h2 id="modalTitle">Add expense</h2>
    <div class="auth-tabs" style="margin-bottom:16px;">
      <button type="button" class="auth-tab active" id="tabExpense">Expense</button>
      <button type="button" class="auth-tab" id="tabIncome">Income</button>
    </div>
    <form id="entryForm">
      <div class="row">
        <div class="field amount-field">
          <label for="amount">Amount</label>
          <input type="number" id="amount" step="0.01" min="0" placeholder="0.00" inputmode="decimal" required>
        </div>
        <div class="field">
          <label for="category">Category</label>
          <select id="category">
            <option>Rent/Mortgage</option>
            <option>Food</option><option>Transport</option><option>Housing</option>
            <option>Utilities</option><option>Shopping</option><option>Health</option>
            <option>Fun</option><option>Other</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="monthPicker">Month</label>
          <input type="month" id="monthPicker" required>
        </div>
        <div class="field" style="flex:0 0 90px;">
          <label for="dayPicker">Day</label>
          <input type="number" id="dayPicker" min="1" max="31" placeholder="1">
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="note">Note (optional)</label>
          <input type="text" id="note" placeholder="e.g. groceries">
        </div>
      </div>
      <div class="receipt-row" id="receiptSection">
        <button type="button" id="scanReceiptBtn">📷 Scan receipt</button>
        <input type="file" id="receiptInput" accept="image/*" capture="environment" style="display:none;">
        <img id="receiptPreview" class="receipt-preview" alt="Receipt preview">
        <div class="receipt-status" id="receiptStatus"></div>
      </div>
      <div class="checkbox-row" id="recurringSection">
        <input type="checkbox" id="recurringCheck">
        <label for="recurringCheck">Repeats every month (e.g. rent, subscriptions)</label>
      </div>
      <div class="modal-actions">
        <button type="button" class="cancel" id="cancelBtn">Cancel</button>
        <button type="submit" class="add" id="addSubmitBtn">Add expense</button>
      </div>
    </form>
  </div>
</div>

<script>
/* ============ CONFIGURE THIS ============ */
const SUPABASE_URL = "https://jkugdymqpsmtyhckbndu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_moIwIQRb_PEtHwuO0ZkqUw_XxcJ8m-A";
const FINNHUB_API_KEY = "dak4jphr01qrg9hr1gn0dak4jphr01qrg9hr1gng";
/* ========================================= */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

sb.auth.onAuthStateChange((event) => {
  if(event === 'PASSWORD_RECOVERY'){
    const newPassword = prompt('Enter a new password:');
    if(newPassword && newPassword.length >= 6){
      sb.auth.updateUser({ password: newPassword }).then(({ error }) => {
        alert(error ? error.message : 'Password updated. You can log in with it now.');
      });
    }
  }
});

const CATEGORY_COLORS = {

function daysInMonth(monthKey){ const [y,m]=monthKey.split('-').map(Number); return new Date(y,m,0).getDate(); }
function fmt(n){
  const symbol = CURRENCY_SYMBOLS[userSettings.currency] || "$";
  return symbol + Number(n).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
}
// Stock data from Finnhub is always priced in USD. fmtStock converts that
// real USD amount into whatever currency the person picked, using a live
// exchange rate — unlike fmt(), which just relabels a manually-entered number.
let exchangeRate = 1;
async function updateExchangeRate(){
  if(userSettings.currency === 'USD'){ exchangeRate = 1; return; }
  try{
    const res = await fetch(`https://api.frankfurter.app/latest?from=USD&to=${userSettings.currency}`);
    const data = await res.json();
    exchangeRate = (data && data.rates && data.rates[userSettings.currency]) ? data.rates[userSettings.currency] : 1;
  }catch(e){
    exchangeRate = 1;
  }
}
function fmtStock(usdAmount){
  const symbol = CURRENCY_SYMBOLS[userSettings.currency] || "$";
  const converted = Number(usdAmount) * exchangeRate;
  return symbol + converted.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
}
function monthLabel(key){ const [y,m]=key.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'}); }
function escapeHtml(str){ const div=document.createElement('div'); div.textContent=str; return div.innerHTML; }

// Builds a donut chart from segments [{label, value, color}] using stacked
// stroke-dasharray circles — no external chart library needed.
function donutChartSVG(segments, opts){
  opts = opts || {};
  const size = opts.size || 180;
  const stroke = opts.stroke || 26;
  const radius = (size - stroke) / 2;
  const cx = size / 2, cy = size / 2;
  const circumference = 2 * Math.PI * radius;
  const total = segments.reduce((s,seg) => s + seg.value, 0);

  if(total <= 0){
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
      <circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="var(--paper-line)" stroke-width="${stroke}"/>
    </svg>`;
  }

  let cumulative = 0;
  let circles = '';
  segments.forEach(seg => {
    if(seg.value <= 0) return;
    const pct = seg.value / total;
    const dash = pct * circumference;
    const gap = circumference - dash;
    const offset = -cumulative * circumference;
    circles += `<circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="${seg.color}" stroke-width="${stroke}"
      stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${offset}"
      transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"/>`;
    cumulative += pct;
  });

  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${circles}</svg>`;
}

function donutLegendHTML(segments, formatFn){
  const total = segments.reduce((s,seg)=>s+seg.value,0);
  return segments.filter(s=>s.value>0).map(seg => {
    const pct = total>0 ? ((seg.value/total)*100).toFixed(0) : 0;
    return `
      <div class="legend-row">
        <span class="legend-dot" style="background:${seg.color}"></span>
        <span class="legend-label">${escapeHtml(seg.label)}</span>
        <span class="legend-value">${formatFn(seg.value)} · ${pct}%</span>
      </div>`;
  }).join('');
}

async function loadUserData(){
  const { data: exp } = await sb.from('expenses').select('*').order('date', {ascending:false});
  expenses = (exp||[]).map(e => ({
    id:e.id, amount:Number(e.amount), category:e.category, note:e.note||'', date:e.date, recurringId:e.recurring_id||null
  }));
  const { data: rec } = await sb.from('recurring_templates').select('*');
  recurringTemplates = (rec||[]).map(t => ({
    id:t.id, amount:Number(t.amount), category:t.category, note:t.note||'', day:t.day,
    startMonth:t.start_month, skippedMonths:t.skipped_months||[]
  }));

  const newOnes = generateRecurringEntries();
  if(newOnes.length) await insertGeneratedEntries(newOnes);

  const { data: wl } = await sb.from('watchlist_items').select('*').order('created_at', {ascending:true});
  watchlist = (wl||[]).map(w => ({ id:w.id, symbol:w.symbol }));

  const { data: ph } = await sb.from('portfolio_holdings').select('*').order('created_at', {ascending:true});
  portfolio = (ph||[]).map(p => ({ id:p.id, symbol:p.symbol, shares:Number(p.shares), costBasis:Number(p.cost_basis) }));

  const { data: cc } = await sb.from('custom_categories').select('*').order('created_at', {ascending:true});
  customCategories = (cc||[]).map(c => c.name);
  customCategories.forEach(ensureCategoryColor);

  const { data: cb } = await sb.from('category_budgets').select('*');
  categoryBudgets = {};
  (cb||[]).forEach(row => { categoryBudgets[row.category] = Number(row.monthly_limit); });

  const { data: settingsRow } = await sb.from('user_settings').select('*').eq('user_id', currentUser.id).maybeSingle();
  if(settingsRow){
    userSettings = { language: settingsRow.language, currency: settingsRow.currency };
  }else{
    userSettings = { language: 'en', currency: 'USD' };
    await sb.from('user_settings').insert({ user_id: currentUser.id, language:'en', currency:'USD' });
  }
  applyDirection();
  await updateExchangeRate();

  const { data: nw } = await sb.from('net_worth_items').select('*').order('created_at', {ascending:true});
  netWorthItems = (nw||[]).map(x => ({ id:x.id, category:x.category, label:x.label, balance:Number(x.balance) }));

  const { data: inc } = await sb.from('income_entries').select('*').order('date', {ascending:false});
  incomeEntries = (inc||[]).map(x => ({ id:x.id, amount:Number(x.amount), category:x.category, note:x.note||'', date:x.date }));
}

      errorEl.textContent = err.message || 'Something went wrong.';
    }finally{
      btn.disabled = false;
    }
  });
}

/* ================= Recurring generation ================= */
function generateRecurringEntries(){
  const nowKey = currentMonthKey();
  const newOnes = [];
  recurringTemplates.forEach(t => {
    const endKey = t.startMonth > nowKey ? t.startMonth : nowKey;
    const skipped = t.skippedMonths || [];
    let m = t.startMonth, guard = 0;
    while(m <= endKey && guard < 600){
      guard++;
      const exists = expenses.some(e => e.recurringId === t.id && e.date.slice(0,7) === m);
      if(!exists && !skipped.includes(m)){
        const day = Math.min(t.day, daysInMonth(m));
        const entry = { id: uid(), amount:t.amount, category:t.category, note:t.note, date:`${m}-${pad2(day)}`, recurringId:t.id };
        expenses.push(entry);
        newOnes.push(entry);
      }
      m = nextMonthKey(m);
    }
  });
  return newOnes;
}
async function insertGeneratedEntries(list){
  const rows = list.map(e => ({ user_id: currentUser.id, amount:e.amount, category:e.category, note:e.note, date:e.date, recurring_id:e.recurringId }));
  const { data } = await sb.from('expenses').insert(rows).select();
  if(data) data.forEach((row,i) => { list[i].id = row.id; });
}

      const val = parseFloat(input);
      if(isNaN(val) || val <= 0) return;
      item.amount = val;

      await sb.from('income_entries').update({ amount: val }).eq('id', id);

  document.querySelectorAll('.entry-row[data-id]').forEach(row => {

      incomeEntries = incomeEntries.filter(i => i.id !== id);
      render();
      await sb.from('income_entries').delete().eq('id', id);

  document.querySelectorAll('.entry-del:not([data-income-id])').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const id = btn.getAttribute('data-id');
      const entry = expenses.find(e => e.id === id);
      if(entry && entry.recurringId){
        const t = recurringTemplates.find(rt => rt.id === entry.recurringId);
        if(t){
          t.skippedMonths = t.skippedMonths || [];
          const mKey = entry.date.slice(0,7);
          if(!t.skippedMonths.includes(mKey)) t.skippedMonths.push(mKey);
          await sb.from('recurring_templates').update({ skipped_months: t.skippedMonths }).eq('id', t.id);
        }
      }
      expenses = expenses.filter(e => e.id !== id);
      render();
      await sb.from('expenses').delete().eq('id', id);
    });
  });
}

function renderNetWorth(){

  document.getElementById('pageSub').innerHTML = '';

  const totalAssets = netWorthItems.filter(i => ASSET_CATS.includes(i.category)).reduce((s,i)=>s+i.balance,0);

      </div>
      <button type="button" class="add" id="addNwBtn">${t('addItem')}</button>
    </div>
  `;

  const allCats = ASSET_CATS.concat(LIABILITY_CATS);
  allCats.forEach(cat => {

    html += `

          </div>

    html += '<div class="empty">Add your accounts above — cash, chequing, investments, cards, loans — to see your full net worth.</div>';
  }

    row.addEventListener('click', async (e) => {
      if(e.target.closest('.stock-del')) return;
      const id = row.getAttribute('data-id');
      const cat = row.getAttribute('data-cat');
      const item = netWorthItems.find(i => i.id === id);
      if(!item) return;

      let newBalance;
      if(LIABILITY_CATS.includes(cat)){
        const input = prompt(`Make a payment toward "${item.label}"\nCurrent balance: ${fmt(item.balance)}\n\nHow much are you paying?`);
        if(input === null) return;
        const payment = parseFloat(input);

async function addSymbol(){
  const input = document.getElementById('symbolInput');
  const symbol = input.value.trim().toUpperCase();
  if(!symbol) return;
  if(watchlist.some(w => w.symbol === symbol)){ input.value=''; return; }

  const { data, error } = await sb.from('watchlist_items').insert({ user_id: currentUser.id, symbol }).select().single();
  if(error){ alert(error.message || 'Could not add that symbol.'); return; }
  watchlist.push({ id:data.id, symbol });
  renderWatchlist();
  await fetchQuote(symbol);
  if(view === "watchlist") renderWatchlist();
}

async function fetchQuote(symbol){
  try{
    const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(symbol)}&token=${FINNHUB_API_KEY}`);
    if(!res.ok) throw new Error('request failed');
    const data = await res.json();
    if(!data || (data.c === 0 && data.d === null)){ quoteCache[symbol] = 'error'; return; }
    quoteCache[symbol] = { price:data.c, change:data.d, changePct:data.dp, high:data.h, low:data.l, open:data.o, prevClose:data.pc };
  }catch(e){
    quoteCache[symbol] = 'error';
  }
}

async function fetchMissingQuotes(){
  const missing = watchlist.filter(w => !quoteCache[w.symbol]);
  if(missing.length === 0) return;
  await Promise.all(missing.map(w => fetchQuote(w.symbol)));
  if(view === "watchlist") renderWatchlist();
}

async function refreshAllQuotes(){
  if(watchlist.length === 0) return;
  quoteCache = {};
  renderWatchlist();
  await Promise.all(watchlist.map(w => fetchQuote(w.symbol)));
  if(view === "watchlist") renderWatchlist();
}

async function fetchStockDetails(symbol){
  const result = { marketCap:null, weekHigh52:null, weekLow52:null, nextEarnings:null, lastEarnings:null };
  try{
    const res = await fetch(`https://finnhub.io/api/v1/stock/metric?symbol=${encodeURIComponent(symbol)}&metric=all&token=${FINNHUB_API_KEY}`);
    const data = await res.json();
    if(data && data.metric){
      result.marketCap = data.metric.marketCapitalization || null;
      result.weekHigh52 = data.metric['52WeekHigh'] || null;
      result.weekLow52 = data.metric['52WeekLow'] || null;
    }
  }catch(e){}

  try{
    const today = new Date();
    const future = new Date(); future.setDate(future.getDate() + 90);
    const fmt2 = d => d.toISOString().slice(0,10);
    const res = await fetch(`https://finnhub.io/api/v1/calendar/earnings?from=${fmt2(today)}&to=${fmt2(future)}&symbol=${encodeURIComponent(symbol)}&token=${FINNHUB_API_KEY}`);
    const data = await res.json();
    if(data && data.earningsCalendar && data.earningsCalendar.length){
      result.nextEarnings = data.earningsCalendar[0];
    }
  }catch(e){}

  try{
    const res = await fetch(`https://finnhub.io/api/v1/stock/earnings?symbol=${encodeURIComponent(symbol)}&token=${FINNHUB_API_KEY}`);
    const data = await res.json();
    if(data && data.length){
      result.lastEarnings = data[0];
    }
  }catch(e){}

  detailsCache[symbol] = result;
}

function renderStockDetail(symbol){
  document.getElementById('pageTitle').innerHTML = `<button class="back-btn" id="backBtn" aria-label="Back">←</button> ${escapeHtml(symbol)}`;
  document.getElementById('pageSub').innerHTML = '';

  const q = quoteCache[symbol];
  const d = detailsCache[symbol];

  let priceHtml = '<div class="detail-price">Loading…</div>';
  if(q && q !== 'error'){
    const dir = q.change > 0 ? 'up' : (q.change < 0 ? 'down' : '');
    const sign = q.change > 0 ? '+' : '';
    priceHtml = `
      <div class="detail-price">${fmtStock(q.price)}</div>
      <div class="detail-change holding-gain ${dir}">${sign}${fmtStock(Math.abs(q.change))} (${sign}${q.changePct.toFixed(2)}%) today</div>`;
  }

  let rangesHtml = '';
  if(q && q !== 'error' && q.low != null && q.high != null){
    const dayPct = q.high > q.low ? ((q.price - q.low) / (q.high - q.low)) * 100 : 50;
    rangesHtml += `
      <div class="metric-box" style="grid-column:1 / -1;">
        <div class="metric-label">Day range</div>
        <div class="range-bar"><div class="range-fill" style="left:${dayPct}%;"></div></div>
        <div class="range-labels"><span>${fmtStock(q.low)}</span><span>${fmtStock(q.high)}</span></div>
      </div>`;
  }
  if(d && d.weekLow52 != null && d.weekHigh52 != null && q && q !== 'error'){
    const wPct = d.weekHigh52 > d.weekLow52 ? ((q.price - d.weekLow52) / (d.weekHigh52 - d.weekLow52)) * 100 : 50;
    const clamped = Math.max(0, Math.min(100, wPct));
    rangesHtml += `
      <div class="metric-box" style="grid-column:1 / -1;">
        <div class="metric-label">52-week range</div>
        <div class="range-bar"><div class="range-fill" style="left:${clamped}%;"></div></div>
        <div class="range-labels"><span>${fmtStock(d.weekLow52)}</span><span>${fmtStock(d.weekHigh52)}</span></div>
      </div>`;
  }

  let metricsHtml = '<div class="metric-grid">' + rangesHtml;
  if(d && d.marketCap != null){
    const convertedCap = d.marketCap * exchangeRate;
    metricsHtml += `
      <div class="metric-box">
        <div class="metric-label">Market cap</div>
        <div class="metric-value">${CURRENCY_SYMBOLS[userSettings.currency]||"$"}${(convertedCap >= 1000 ? (convertedCap/1000).toFixed(2)+'B' : convertedCap.toFixed(0)+'M')}</div>
      </div>`;
  }
  if(q && q !== 'error' && q.open != null){
    metricsHtml += `
      <div class="metric-box">
        <div class="metric-label">Open</div>
        <div class="metric-value">${fmtStock(q.open)}</div>
      </div>`;
  }
  metricsHtml += '</div>';

  let earningsHtml = '<div class="section-label">Earnings</div>';
  if(d && d.nextEarnings){
    earningsHtml += `
      <div class="earnings-row">
        <div class="earnings-label">Next earnings date</div>
        <div class="earnings-value">${escapeHtml(d.nextEarnings.date || '—')}${d.nextEarnings.epsEstimate ? ` · est. EPS ${d.nextEarnings.epsEstimate}` : ''}</div>
      </div>`;
  }else{
    earningsHtml += `<div class="earnings-row"><div class="earnings-value">No upcoming earnings date found.</div></div>`;
  }
  if(d && d.lastEarnings){
    const actual = d.lastEarnings.actual, estimate = d.lastEarnings.estimate;
    let resultLabel = '';
    if(actual != null && estimate != null){
      resultLabel = actual >= estimate
        ? `<span class="beat">Beat estimate</span>`
        : `<span class="miss">Missed estimate</span>`;
    }
    earningsHtml += `
      <div class="earnings-row">
        <div class="earnings-label">Last quarter (${escapeHtml(d.lastEarnings.period || '')})</div>
        <div class="earnings-value">Actual EPS ${actual != null ? actual : '—'} vs. estimate ${estimate != null ? estimate : '—'} ${resultLabel}</div>
      </div>`;
  }else{
    earningsHtml += `<div class="earnings-row"><div class="earnings-value">No recent earnings data found.</div></div>`;
  }

  document.getElementById('mainArea').innerHTML = `
    <div class="detail-price-block">${priceHtml}</div>
    ${metricsHtml}
    ${earningsHtml}
    <p class="hero-body" style="font-size:12px;margin-top:18px;">Data from Finnhub. This is factual market data only — not a recommendation to buy, hold, or sell.</p>
  `;

  document.getElementById('backBtn').addEventListener('click', () => { view=detailReturnView; render(); });

  if(!q || q === 'error') fetchQuote(symbol).then(() => { if(view === "portfolioDetail") renderStockDetail(symbol); });
  if(!d) fetchStockDetails(symbol).then(() => { if(view === "portfolioDetail") renderStockDetail(symbol); });
}

/* ================= Modal / add form ================= */
const backdrop = document.getElementById('backdrop');
const fabAdd = document.getElementById('fabAdd');
const cancelBtn = document.getElementById('cancelBtn');
const entryForm = document.getElementById('entryForm');
const addSubmitBtn = document.getElementById('addSubmitBtn');
const scanReceiptBtn = document.getElementById('scanReceiptBtn');
const receiptInput = document.getElementById('receiptInput');
const receiptPreview = document.getElementById('receiptPreview');
const receiptStatus = document.getElementById('receiptStatus');
let receiptWorker = null;

function setReceiptStatus(message){
  receiptStatus.textContent = message || '';
}

// Reads receipt text via free, on-device OCR (Tesseract.js) — no API key,
// no server, and no per-scan cost, since nothing leaves the browser.
function parseReceiptText(text){
  const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);

  let total = null;
  const totalPatterns = [
    /(?:grand\s*total|total\s*due|amount\s*due|balance\s*due|total)[^0-9$€£﷼]*([$€£﷼]?\s*\d+[\d,]*\.\d{2})/i,
    /([$€£﷼]?\s*\d+[\d,]*\.\d{2})\s*$/i
  ];
  for(const line of lines){
    for(const re of totalPatterns){
      const m=line.match(re);
      if(m){
        const n=Number(m[1].replace(/[^0-9.]/g,'').replace(/,(?=\d{3}\b)/g,''));
        if(Number.isFinite(n) && n>0){ total=n; break; }
      }
    }
    if(total !== null) break;
  }

  let date = null;
  const dateRegexes = [
    /\b(20\d{2})[-\/](\d{1,2})[-\/](\d{1,2})\b/,
    /\b(\d{1,2})[-\/](\d{1,2})[-\/](20\d{2})\b/,
    /\b(\d{1,2})\s+([A-Za-z]{3,9})\s+(20\d{2})\b/i
  ];
  const months={jan:1,january:1,feb:2,february:2,mar:3,march:3,apr:4,april:4,may:5,jun:6,june:6,jul:7,july:7,aug:8,august:8,sep:9,sept:9,september:9,oct:10,october:10,nov:11,november:11,dec:12,december:12};
  for(const line of lines){
    let m=line.match(dateRegexes[0]);
    if(m){ date=`${m[1]}-${pad2(m[2])}-${pad2(m[3])}`; break; }
    m=line.match(dateRegexes[1]);
    if(m){
      const a=Number(m[1]), b=Number(m[2]), y=m[3];
      const mm = a>12 ? b : b>12 ? a : a;
      const dd = a>12 ? a : b>12 ? b : b;
      date=`${y}-${pad2(mm)}-${pad2(dd)}`; break;
    }
    m=line.match(dateRegexes[2]);
    if(m){ const mm=months[m[2].toLowerCase()]; if(mm) { date=`${m[3]}-${pad2(mm)}-${pad2(m[1])}`; break; } }
  }

  const merchantExclusions=/^(receipt|invoice|store|date|time|cashier|subtotal|total|tax|visa|mastercard|amex|debit|credit|thank|welcome|www\.|http)/i;
  let merchant='';
  for(const line of lines.slice(0,10)){
    if(line.length>=2 && !merchantExclusions.test(line) && !/^[$€£﷼]?\s*\d[\d,]*[.]?\d*$/.test(line)) {
      merchant=line.replace(/[^\w&.'’()\- ]/g,' ').replace(/\s+/g,' ').trim();
      if(merchant.length>=2) break;
    }
  }

  const all=lines.join(' ').toLowerCase();
  let category='Other';
  if(/rent|mortgage|landlord|property management/.test(all)) category='Rent/Mortgage';
  else if(/walmart|costco|loblaw|no frills|sobeys|metro|grocery|grocer|whole foods|food basics/.test(all)) category='Food';
  else if(/uber|lyft|shell|esso|petro|gas station|parking|transit|ttc/.test(all)) category='Transport';
  else if(/pharmacy|rexall|shoppers drug mart|clinic|dental|health/.test(all)) category='Health';
  else if(/netflix|spotify|cinema|movie|restaurant|starbucks|mcdonald|tim hortons/.test(all)) category='Fun';
  else if(/home depot|ikea|wayfair|furniture/.test(all)) category='Housing';
  else if(/hydro|enbridge|bell|rogers|telus|internet|utility/.test(all)) category='Utilities';
  else if(/amazon|best buy|winners|mall|shopping/.test(all)) category='Shopping';

  return {merchant,total,date,category};
}

async function scanReceipt(file){
  if(!file) return;
  if(!window.Tesseract){ setReceiptStatus('Receipt scanner is still loading. Please try again.'); return; }
  if(!file.type.startsWith('image/')){ setReceiptStatus('Please choose an image file.'); return; }
  scanReceiptBtn.disabled = true;
  addSubmitBtn.disabled = true;
  setReceiptStatus('Reading receipt… this can take a little while on the first scan.');
  receiptPreview.src = URL.createObjectURL(file);
  receiptPreview.classList.add('show');
  try{
    if(!receiptWorker){
      receiptWorker = await Tesseract.createWorker('eng');
    }
    const { data } = await receiptWorker.recognize(file);
    const parsed = parseReceiptText(data.text || '');

    if(parsed.total !== null) document.getElementById('amount').value = parsed.total.toFixed(2);
    if(parsed.date){
      const parts=parsed.date.split('-');
      document.getElementById('monthPicker').value=`${parts[0]}-${parts[1]}`;
      document.getElementById('dayPicker').value=Number(parts[2]);
    }
    refreshCategoryOptions(document.getElementById('category'), parsed.category);
    if(parsed.merchant){ document.getElementById('note').value = parsed.merchant; }

    const found=[];
    if(parsed.merchant) found.push(`merchant: ${parsed.merchant}`);
    if(parsed.total !== null) found.push(`total: ${fmt(parsed.total)}`);
    if(parsed.date) found.push(`date: ${parsed.date}`);
    setReceiptStatus(found.length ? `Found ${found.join(' • ')}. Please review before saving.` : 'Could not confidently find the total/date. Please review the fields manually.');
  }catch(err){
    console.error(err);
    setReceiptStatus('Could not read this receipt. Try a clearer, well-lit photo.');
  }finally{
    scanReceiptBtn.disabled = false;
    addSubmitBtn.disabled = false;
  }
}

function refreshCategoryOptions(selectEl, currentValue){
  const allCats = CATEGORY_ORDER.concat(customCategories.filter(c => !CATEGORY_ORDER.includes(c)));
  let html = allCats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  html += `<option value="__new__">+ Add new category…</option>`;
  selectEl.innerHTML = html;
  if(currentValue && allCats.includes(currentValue)) selectEl.value = currentValue;
}

function ensureCategoryColor(cat){
  if(!CATEGORY_COLORS[cat]){
    const palette = ["#7A6F8A","#4A7C8C","#8C6B4A","#6B8C4A","#8C4A6B"];
    CATEGORY_COLORS[cat] = palette[Object.keys(CATEGORY_COLORS).length % palette.length];
  }
}

document.getElementById('category').addEventListener('change', async (e) => {
  if(e.target.value === '__new__'){
    const name = prompt('New category name:');
    if(name && name.trim()){
      const trimmed = name.trim();
      if(!customCategories.includes(trimmed) && !CATEGORY_ORDER.includes(trimmed)){
        const { data, error } = await sb.from('custom_categories').insert({ user_id: currentUser.id, name: trimmed }).select().single();
        if(!error){ customCategories.push(trimmed); ensureCategoryColor(trimmed); }
      }
      refreshCategoryOptions(e.target, trimmed);
    }else{
      refreshCategoryOptions(e.target, 'Other');
    }
  }
});

let entryType = 'expense'; // 'expense' | 'income'

function setEntryType(newType){
  entryType = newType;
  document.getElementById('tabExpense').textContent = t('expenseTab');
  document.getElementById('tabIncome').textContent = t('incomeTab');
  document.getElementById('tabExpense').classList.toggle('active', newType==='expense');
  document.getElementById('tabIncome').classList.toggle('active', newType==='income');
  document.getElementById('modalTitle').textContent = newType==='expense' ? t('addExpense') : t('addIncome');
  document.getElementById('addSubmitBtn').textContent = newType==='expense' ? t('addExpense') : t('addIncome');
  document.getElementById('receiptSection').style.display = newType==='expense' ? 'block' : 'none';
  document.getElementById('recurringSection').style.display = newType==='expense' ? 'flex' : 'none';
  const categorySelect = document.getElementById('category');
  if(newType==='income'){
    categorySelect.innerHTML = INCOME_CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('');
  }else{
    refreshCategoryOptions(categorySelect, 'Rent/Mortgage');
  }
}
document.getElementById('tabExpense').addEventListener('click', () => setEntryType('expense'));
document.getElementById('tabIncome').addEventListener('click', () => setEntryType('income'));

function openModal(){
  document.getElementById('monthPicker').value = (view==="detail" && activeMonth) ? activeMonth : currentMonthKey();
  document.getElementById('dayPicker').value = currentDay();
  document.getElementById('recurringCheck').checked = false;
  setEntryType('expense');
  receiptInput.value=''; receiptPreview.src=''; receiptPreview.classList.remove('show'); setReceiptStatus('');
  backdrop.classList.add('open');
  document.getElementById('amount').focus();
}
function closeModal(){
  backdrop.classList.remove('open'); entryForm.reset();
  receiptInput.value=''; receiptPreview.src=''; receiptPreview.classList.remove('show'); setReceiptStatus('');
}
fabAdd.addEventListener('click', openModal);
cancelBtn.addEventListener('click', closeModal);
scanReceiptBtn.addEventListener('click', () => receiptInput.click());
receiptInput.addEventListener('change', () => { const file=receiptInput.files && receiptInput.files[0]; scanReceipt(file); });
backdrop.addEventListener('click', (e) => { if(e.target === backdrop) closeModal(); });

entryForm.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const amount = parseFloat(document.getElementById('amount').value);
  if(!amount || amount <= 0) return;
  const monthVal = document.getElementById('monthPicker').value;
  if(!monthVal) return;
  let day = parseInt(document.getElementById('dayPicker').value,10);
  if(!day || day<1) day=1; if(day>31) day=31;
  const category = document.getElementById('category').value;
  const note = document.getElementById('note').value.trim();
  const isRecurring = entryType==='expense' && document.getElementById('recurringCheck').checked;
  const date = `${monthVal}-${pad2(day)}`;

  addSubmitBtn.disabled = true;
  try{
    if(entryType === 'income'){
      const { data, error } = await sb.from('income_entries').insert({
        user_id: currentUser.id, amount, category, note, date
      }).select().single();
      if(error) throw error;
      incomeEntries.push({ id:data.id, amount, category, note, date });
    }else if(isRecurring){
      const { data, error } = await sb.from('recurring_templates').insert({
        user_id: currentUser.id, amount, category, note, day, start_month: monthVal, skipped_months: []
      }).select().single();
      if(error) throw error;
      recurringTemplates.push({ id:data.id, amount, category, note, day, startMonth:monthVal, skippedMonths:[] });
      const newOnes = generateRecurringEntries();
      if(newOnes.length) await insertGeneratedEntries(newOnes);
    }else{
      const { data, error } = await sb.from('expenses').insert({
        user_id: currentUser.id, amount, category, note, date
      }).select().single();
      if(error) throw error;
      expenses.push({ id:data.id, amount, category, note, date });
    }
    activeMonth = monthVal;
    view = "detail";
    render();
    closeModal();
  }catch(err){
    alert(err.message || 'Could not save that entry. Try again.');
  }finally{
    addSubmitBtn.disabled = false;
  }
});

boot();
</script>
