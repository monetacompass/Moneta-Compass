              <div class="label" style="margin-top:8px;">Total interest paid</div><div class="value" style="font-size:20px;">${avalanche.neverPaysOff ? '—' : fmt(avalanche.totalInterest)}</div>
            </div>
          </div>
          <div class="chart-block">
            <div class="chart-title">Snowball (smallest balance first)</div>
            <div class="nw-card" style="margin-top:8px;">
              <div class="label">Debt-free in</div><div class="value">${snowball.neverPaysOff ? 'Never at this rate' : snowball.months + ' mo'}</div>
              <div class="label" style="margin-top:8px;">Total interest paid</div><div class="value" style="font-size:20px;">${snowball.neverPaysOff ? '—' : fmt(snowball.totalInterest)}</div>
            </div>
          </div>
        </div>
        ${(!eitherNeverPaysOff && savings > 1) ? `<div class="insight-card">Avalanche saves you ${fmt(savings)} in interest compared to Snowball for these balances — Snowball may still feel more motivating if you want quick wins first.</div>` : ''}

      `;
    }
    document.getElementById('debtExtra').addEventListener('input', recalcDebt);
    recalcDebt();
  }
}

/* ================= Cash Flow Forecast ================= */
function renderCashFlow(){
  document.getElementById('pageTitle').innerHTML = `<button class="back-btn" id="backBtn" aria-label="Back"><svg width="9" height="14" viewBox="0 0 9 14" style="display:block;"><path d="M8 1L2 7L8 13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button> ${t('cashFlowLabel')}`;
  document.getElementById('pageSub').innerHTML = '';

  const liquidBalance = accounts
    .filter(a => ["Chequing","Savings","Cash"].includes(a.type))
    .reduce((s,a) => s + a.balance, 0);

  const nowKey = currentMonthKey();
  const priorMonths = [1,2,3].map(n => shiftMonthKey(nowKey, -n));
  let incomeSum = 0, expenseSum = 0, monthsWithData = 0;
  priorMonths.forEach(mk => {
    const inc = incomeEntries.filter(i => i.date.slice(0,7)===mk).reduce((s,i)=>s+i.amount,0);
    const exp = expenses.filter(e => e.date.slice(0,7)===mk).reduce((s,e)=>s+e.amount,0);
    if(inc > 0 || exp > 0){ incomeSum += inc; expenseSum += exp; monthsWithData++; }
  });
  if(monthsWithData === 0){
    const inc = incomeEntries.filter(i => i.date.slice(0,7)===nowKey).reduce((s,i)=>s+i.amount,0);
    const exp = expenses.filter(e => e.date.slice(0,7)===nowKey).reduce((s,e)=>s+e.amount,0);
    incomeSum = inc; expenseSum = exp; monthsWithData = 1;
  }
  const avgMonthlyIncome = incomeSum / monthsWithData;
  const avgMonthlyExpense = expenseSum / monthsWithData;
  const dailyNet = (avgMonthlyIncome - avgMonthlyExpense) / 30;

  const day30 = liquidBalance + dailyNet*30;
  const day60 = liquidBalance + dailyNet*60;
  const day90 = liquidBalance + dailyNet*90;

  const chart = lineChartSVG(
    [{ label:'Projected balance', color: dailyNet>=0 ? 'var(--moss)' : 'var(--rust)', points:[liquidBalance, day30, day60, day90] }],
    ['Today','30 days','60 days','90 days'],
    { yFormat: v => fmt(v).replace(/\.00$/,''), tooltipFormat: fmt }
  );

  document.getElementById('mainArea').innerHTML = `
    <p class="hero-body" style="font-size:13px;">Projects your liquid cash (Chequing, Savings, Cash accounts) forward using your average income and spending from the last ${monthsWithData} month${monthsWithData===1?'':'s'}. This is an estimate, not a guarantee — one big expense or a late paycheck changes everything.</p>

    <div class="networth-summary">
      <div class="nw-card"><div class="label">Cash today</div><div class="value">${fmt(liquidBalance)}</div></div>
      <div class="nw-card"><div class="label">Avg. monthly income</div><div class="value" style="color:var(--moss);">${fmt(avgMonthlyIncome)}</div></div>
      <div class="nw-card"><div class="label">Avg. monthly spending</div><div class="value">${fmt(avgMonthlyExpense)}</div></div>
    </div>

    <div class="section-label">Projected cash on hand</div>
    <div id="cashFlowChart">${chart}</div>
    <div class="legend-list" style="margin-top:10px;">
      <div class="legend-row"><span class="legend-label">In 30 days</span><span class="legend-value">${fmt(day30)}</span></div>
      <div class="legend-row"><span class="legend-label">In 60 days</span><span class="legend-value">${fmt(day60)}</span></div>
      <div class="legend-row"><span class="legend-label">In 90 days</span><span class="legend-value">${fmt(day90)}</span></div>
    </div>
    ${day90 < 0 ? `<div class="insight-card" style="border-left-color:var(--rust);margin-top:14px;">At this rate, your projected cash goes negative within 90 days. Worth reviewing spending or income soon.</div>` : ''}

}

/* ================= Financial Health Score ================= */
function computeHealthScore(){
  const monthKey = currentMonthKey();
  const priorMonths = [1,2,3].map(n => shiftMonthKey(monthKey, -n));
  let incomeSum = 0, expenseSum = 0, monthsData = 0;
  priorMonths.forEach(mk => {
    const inc = incomeEntries.filter(i => i.date.slice(0,7)===mk).reduce((s,i)=>s+i.amount,0);
    const exp = expenses.filter(e => e.date.slice(0,7)===mk).reduce((s,e)=>s+e.amount,0);
    if(inc > 0 || exp > 0){ incomeSum += inc; expenseSum += exp; monthsData++; }
  });
  if(monthsData === 0){
    incomeSum = incomeEntries.filter(i => i.date.slice(0,7)===monthKey).reduce((s,i)=>s+i.amount,0);
    expenseSum = expenses.filter(e => e.date.slice(0,7)===monthKey).reduce((s,e)=>s+e.amount,0);
    monthsData = 1;
  }
  const avgIncome = incomeSum / monthsData;
  const avgExpense = expenseSum / monthsData;

  const savingsRate = avgIncome > 0 ? (avgIncome-avgExpense)/avgIncome : null;
  let savingsScore, savingsNote;
  if(savingsRate == null){ savingsScore = null; savingsNote = "Not enough income data logged yet to calculate this."; }
  else if(savingsRate >= 0.2){ savingsScore = 100; savingsNote = `Saving about ${(savingsRate*100).toFixed(0)}% of income — excellent.`; }
  else if(savingsRate >= 0.1){ savingsScore = 75; savingsNote = `Saving about ${(savingsRate*100).toFixed(0)}% of income — solid.`; }
  else if(savingsRate >= 0){ savingsScore = 45; savingsNote = `Saving about ${(savingsRate*100).toFixed(0)}% of income — there's room to grow this.`; }
  else { savingsScore = 10; savingsNote = `Spending is outpacing income by about ${Math.abs(savingsRate*100).toFixed(0)}%.`; }

  const liquid = accounts.filter(a => ["Chequing","Savings","Cash"].includes(a.type)).reduce((s,a)=>s+a.balance,0);
  const runwayMonths = avgExpense > 0 ? liquid/avgExpense : null;
  let efScore, efNote;
  if(runwayMonths == null){ efScore = null; efNote = "Not enough spending data logged yet to calculate this."; }
  else if(runwayMonths >= 6){ efScore = 100; efNote = `${runwayMonths.toFixed(1)} months of expenses covered by liquid savings — excellent buffer.`; }
  else if(runwayMonths >= 3){ efScore = 75; efNote = `${runwayMonths.toFixed(1)} months covered — a good buffer.`; }
  else if(runwayMonths >= 1){ efScore = 45; efNote = `${runwayMonths.toFixed(1)} months covered — on the thin side.`; }
  else { efScore = 15; efNote = `Under a month of expenses sitting in liquid accounts.`; }

  const totalLiabilities = accounts.filter(a => ACCOUNT_LIABILITY_TYPES.includes(a.type)).reduce((s,a)=>s+a.balance,0)
    + netWorthItems.filter(i => LIABILITY_CATS.includes(i.category)).reduce((s,i)=>s+i.balance,0);
  const annualIncome = avgIncome * 12;
  const debtToIncome = annualIncome > 0 ? totalLiabilities/annualIncome : null;
  let debtScore, debtNote;
  if(totalLiabilities === 0){ debtScore = 100; debtNote = "No tracked debt — excellent."; }
  else if(debtToIncome == null){ debtScore = 50; debtNote = `${fmt(totalLiabilities)} in tracked debt (not enough income data to compare against).`; }
  else if(debtToIncome < 0.2){ debtScore = 90; debtNote = `Tracked debt is about ${(debtToIncome*100).toFixed(0)}% of annual income — low.`; }
  else if(debtToIncome < 0.5){ debtScore = 65; debtNote = `Tracked debt is about ${(debtToIncome*100).toFixed(0)}% of annual income — moderate.`; }
  else if(debtToIncome < 1){ debtScore = 35; debtNote = `Tracked debt is about ${(debtToIncome*100).toFixed(0)}% of annual income — high.`; }
  else { debtScore = 10; debtNote = `Tracked debt exceeds a full year of income.`; }

  const dailyNet = (avgIncome-avgExpense)/30;
  let cfScore, cfNote;
  if(dailyNet > 0){ cfScore = 90; cfNote = "Trending positive — more coming in than going out."; }
  else if(dailyNet === 0){ cfScore = 50; cfNote = "Roughly breaking even."; }
  else { cfScore = 20; cfNote = "Trending negative — spending is outpacing income lately."; }

  const hasInvesting = accounts.some(a => a.type === 'Investment') || portfolio.some(p => p.shares > 0.00001);
  const investScore = hasInvesting ? 90 : 30;
  const investNote = hasInvesting ? "You have money working in investments." : "No investment accounts or stock holdings tracked yet.";

  const parts = [
    { label:'Savings rate', score:savingsScore, note:savingsNote },
    { label:'Emergency fund', score:efScore, note:efNote },
    { label:'Debt load', score:debtScore, note:debtNote },
    { label:'Cash flow trend', score:cfScore, note:cfNote },
    { label:'Investing', score:investScore, note:investNote }
  ];
  const valid = parts.filter(p => p.score != null);
  const overall = valid.length > 0 ? Math.round(valid.reduce((s,p)=>s+p.score,0)/valid.length) : null;
  return { overall, parts };
}

function renderHealthScore(){
  document.getElementById('pageTitle').innerHTML = `<button class="back-btn" id="backBtn" aria-label="Back"><svg width="9" height="14" viewBox="0 0 9 14" style="display:block;"><path d="M8 1L2 7L8 13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button> ${t('healthScoreLabel')}`;
  document.getElementById('pageSub').innerHTML = '';

  const { overall, parts } = computeHealthScore();
  let scoreLabel = 'Not enough data yet';
  if(overall != null){
    if(overall >= 80) scoreLabel = 'Excellent';
    else if(overall >= 60) scoreLabel = 'Good';
    else if(overall >= 40) scoreLabel = 'Fair';
    else scoreLabel = 'Needs attention';
  }

  const partsHtml = parts.map(p => {
    if(p.score == null){
      return `<div class="budget-row"><div class="budget-top"><span>${p.label}</span><span style="color:var(--ink-soft);">No data</span></div><p class="hero-body" style="font-size:12px;margin:4px 0 16px;">${p.note}</p></div>`;
    }
    const cls = p.score >= 60 ? 'ok' : 'over';
    return `
      <div class="budget-row">
        <div class="budget-top"><span>${p.label}</span><span>${p.score}/100</span></div>
        <div class="budget-track"><div class="budget-fill ${cls}" style="width:${p.score}%;"></div></div>
      </div>
      <p class="hero-body" style="font-size:12px;margin:4px 0 16px;">${p.note}</p>`;
  }).join('');

  const weakest = parts.filter(p => p.score != null).sort((a,b)=>a.score-b.score).slice(0,2);
  const recsHtml = weakest.filter(p => p.score < 70).map(p =>
    `<div class="insight-card">Lowest area: <strong>${p.label}</strong>. ${p.note}</div>`
  ).join('');

  document.getElementById('mainArea').innerHTML = `
    <p class="hero-body" style="font-size:13px;">A transparent score built from your own data — savings rate, emergency fund coverage, debt load, cash flow trend, and whether you're investing. Nothing here is hidden math; each piece is explained below.</p>

    <div class="nw-card highlight" style="text-align:center;margin-bottom:24px;">
      <div class="label">Overall score</div>
      <div class="value" style="font-size:44px;color:${overall!=null?'var(--paper)':'var(--on-highlight-soft)'};">${overall != null ? overall : '—'}</div>
      <div class="sub" style="color:var(--on-highlight-soft);font-weight:600;">${scoreLabel}</div>
    </div>

    <div class="section-label">Breakdown</div>
    ${partsHtml}

    ${recsHtml ? `<div class="section-label">Worth focusing on</div>${recsHtml}` : ''}
  `;

  document.getElementById('backBtn').addEventListener('click', () => { view="months"; render(); });
}

function renderRetirement(){
  document.getElementById('pageTitle').innerHTML = `<button class="back-btn" id="backBtn" aria-label="Back"><svg width="9" height="14" viewBox="0 0 9 14" style="display:block;"><path d="M8 1L2 7L8 13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button> ${t('retirementLabel')}`;
  document.getElementById('pageSub').innerHTML = '';

  document.getElementById('mainArea').innerHTML = `
    <p class="hero-body" style="font-size:13px;">Projects your retirement savings under three scenarios so you can see a realistic range, not just one guess.</p>
    <div class="row">
      <div class="field"><label>Current age</label><input type="number" id="retCurrentAge" min="0" max="100" step="1"></div>
      <div class="field"><label>Retirement age</label><input type="number" id="retTargetAge" min="0" max="100" step="1"></div>
    </div>
    <div class="row">
      <div class="field"><label>Current investments</label><input type="number" id="retCurrent" min="0" step="100"></div>
      <div class="field"><label>Monthly contribution</label><input type="number" id="retMonthly" min="0" step="10"></div>
    </div>
    <div class="row">
      <div class="field"><label>Expected annual return (%)</label><input type="number" id="retRate" min="0" max="30" step="0.1"></div>
      <div class="field"><label>Annual inflation (%)</label><input type="number" id="retInflation" min="0" max="30" step="0.1"></div>
    </div>

    <div id="retResults"></div>
    <div class="section-label">Projected growth (Expected scenario)</div>
    <div id="retChart"></div>
    <div class="legend-list" id="retLegend" style="margin-top:8px;"></div>

    <p class="hero-body" style="font-size:12px;margin-top:16px;">Conservative and Optimistic use the expected return minus/plus 2 percentage points. These are projections based on the numbers you enter, not guarantees — real markets are far less smooth than this chart.</p>
  `;
  document.getElementById('backBtn').addEventListener('click', () => { view="months"; render(); });

  const RET_DEFAULTS = { retCurrentAge:30, retTargetAge:65, retCurrent:20000, retMonthly:400, retRate:7, retInflation:3 };
  let saved = {};
  try{ saved = JSON.parse(localStorage.getItem('moneta-retirement') || '{}'); }catch(e){}
  Object.keys(RET_DEFAULTS).forEach(id => {
    document.getElementById(id).value = saved[id] != null ? saved[id] : RET_DEFAULTS[id];
  });

  const inputs = Object.keys(RET_DEFAULTS).map(id => document.getElementById(id));
  function recalc(){
    const currentAge = parseInt(document.getElementById('retCurrentAge').value) || 0;
    const targetAge = parseInt(document.getElementById('retTargetAge').value) || 0;
    const current = parseFloat(document.getElementById('retCurrent').value) || 0;
    const monthly = parseFloat(document.getElementById('retMonthly').value) || 0;
    const rate = parseFloat(document.getElementById('retRate').value) || 0;
    const inflation = parseFloat(document.getElementById('retInflation').value) || 0;
    const years = Math.max(1, targetAge - currentAge);

    try{
      localStorage.setItem('moneta-retirement', JSON.stringify({
        retCurrentAge:currentAge, retTargetAge:targetAge, retCurrent:current, retMonthly:monthly, retRate:rate, retInflation:inflation
      }));
    }catch(e){}

    const conservative = computeGrowth(current, monthly, Math.max(0, rate-2), years, inflation);
    const expected = computeGrowth(current, monthly, rate, years, inflation);
    const optimistic = computeGrowth(current, monthly, rate+2, years, inflation);

    document.getElementById('retResults').innerHTML = `
      <div class="section-label">At age ${targetAge} (in ${years} years)</div>
      <div class="charts-row">
        <div class="chart-block"><div class="chart-title">Conservative (${Math.max(0,rate-2).toFixed(1)}%)</div>
          <div class="nw-card" style="margin-top:8px;"><div class="label">Nominal</div><div class="value" style="font-size:19px;">${fmt(conservative.finalNominal)}</div>
          <div class="label" style="margin-top:8px;">Inflation-adjusted</div><div class="value" style="font-size:16px;">${fmt(conservative.finalReal)}</div></div>
        </div>
        <div class="chart-block"><div class="chart-title">Expected (${rate.toFixed(1)}%)</div>
          <div class="nw-card highlight" style="margin-top:8px;"><div class="label">Nominal</div><div class="value" style="font-size:19px;">${fmt(expected.finalNominal)}</div>
          <div class="label" style="margin-top:8px;">Inflation-adjusted</div><div class="value" style="font-size:16px;">${fmt(expected.finalReal)}</div></div>
        </div>
        <div class="chart-block"><div class="chart-title">Optimistic (${(rate+2).toFixed(1)}%)</div>
          <div class="nw-card" style="margin-top:8px;"><div class="label">Nominal</div><div class="value" style="font-size:19px;">${fmt(optimistic.finalNominal)}</div>
          <div class="label" style="margin-top:8px;">Inflation-adjusted</div><div class="value" style="font-size:16px;">${fmt(optimistic.finalReal)}</div></div>
        </div>
      </div>
    `;

    const labels = expected.nominalByYear.map((_,i) => `Age ${currentAge+i}`);
    document.getElementById('retChart').innerHTML = lineChartSVG(
      [
        { label:'Nominal value', color:'var(--moss)', points:expected.nominalByYear },
        { label:'Inflation-adjusted', color:'var(--rust)', points:expected.realByYear },
        { label:'Total contributed', color:'#5B7CA8', points:expected.contributedByYear }
      ],
      labels,
      { yFormat: v => fmt(v).replace(/\.00$/,''), tooltipFormat: fmt }
    );
    document.getElementById('retLegend').innerHTML = `
      <div class="legend-row"><span class="legend-dot" style="background:var(--moss)"></span><span class="legend-label">Nominal value</span><span class="legend-value">${fmt(expected.finalNominal)}</span></div>
      <div class="legend-row"><span class="legend-dot" style="background:var(--rust)"></span><span class="legend-label">Inflation-adjusted value</span><span class="legend-value">${fmt(expected.finalReal)}</span></div>
      <div class="legend-row"><span class="legend-dot" style="background:#5B7CA8"></span><span class="legend-label">Total contributed</span><span class="legend-value">${fmt(expected.totalContributed)}</span></div>
    `;
  }
  inputs.forEach(el => el.addEventListener('input', recalc));
  recalc();
}

async function uploadDocument(){
  const label = document.getElementById('docLabel').value.trim();
  const category = document.getElementById('docCategory').value;
  const fileInput = document.getElementById('docFileInput');
  const file = fileInput.files[0];
  const statusEl = document.getElementById('docUploadStatus');
  if(!label || !file){ statusEl.textContent = 'Add a label and choose a file first.'; return; }

  statusEl.textContent = 'Uploading...';
  try{
    const ext = file.name.includes('.') ? file.name.split('.').pop() : 'dat';
    const path = `${currentUser.id}/${Date.now()}.${ext}`;
    const { error: upErr } = await sb.storage.from('documents').upload(path, file);
    if(upErr) throw upErr;

    const { data, error } = await sb.from('documents').insert({
      user_id: currentUser.id, label, category, storage_path:path, file_name:file.name
    }).select().single();
    if(error) throw error;

    documents.unshift({ id:data.id, label, category, storagePath:path, fileName:file.name, uploadedAt:data.uploaded_at });
    renderDocuments();
  }catch(err){
    statusEl.textContent = err.message || 'Upload failed.';
  }
}

// Replays the full buy/sell/dividend history in order (cost basis depends
// on everything before it), but only accumulates gains and dividends that
// fall in the requested calendar year — so a sale's gain is correct even
// though it depends on purchases from other years.
function computeYearlyInvestmentTaxData(year){
  const bySymbol = {};
  let capitalGains = 0, dividends = 0;
  investmentTxns.slice().sort((a,b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id)).forEach(tx => {
    if(!bySymbol[tx.symbol]) bySymbol[tx.symbol] = { shares:0, totalCost:0 };
    const h = bySymbol[tx.symbol];
    const txYear = parseInt(tx.date.slice(0,4),10);
    if(tx.type === 'buy'){
      h.totalCost += tx.shares*tx.price + (tx.fees||0);
      h.shares += tx.shares;
    }else if(tx.type === 'sell'){
      const avgCost = h.shares>0 ? h.totalCost/h.shares : 0;
      const sellShares = Math.min(tx.shares, h.shares);
      const costOfSold = avgCost*sellShares;
      const proceeds = sellShares*tx.price - (tx.fees||0);
      if(txYear === year) capitalGains += proceeds - costOfSold;
      h.totalCost -= costOfSold;
      h.shares -= sellShares;
    }else if(tx.type === 'dividend'){
      if(txYear === year) dividends += tx.price;
    }
  });
  return { capitalGains, dividends };
}

async function addTaxEntry(taxYear){
  const entryType = document.getElementById('taxEntryType').value;
  const amount = parseFloat(document.getElementById('taxEntryAmount').value);
  const description = document.getElementById('taxEntryDesc').value.trim();
  if(!amount || amount <= 0) return;

  const { data, error } = await sb.from('tax_entries').insert({
    user_id: currentUser.id, tax_year:taxYear, entry_type:entryType, description:description||null, amount
  }).select().single();
  if(error){ alert(error.message || 'Could not add that entry.'); return; }

  taxEntries.push({ id:data.id, taxYear, entryType, description, amount });
  renderTaxCenter();
}

function csvEscape(val){
  const s = String(val == null ? '' : val);
  if(s.includes(',') || s.includes('"') || s.includes('\n')){
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

function exportDataAsCSV(){
  const lines = [];

  lines.push('EXPENSES');
  lines.push(['Date','Category','Amount','Note','Recurring'].join(','));
  expenses.forEach(e => {
    lines.push([e.date, csvEscape(e.category), e.amount, csvEscape(e.note), e.recurringId ? 'Yes' : 'No'].join(','));
  });
  lines.push('');

  lines.push('INCOME');
  lines.push(['Date','Category','Amount','Note'].join(','));
  incomeEntries.forEach(i => {
    lines.push([i.date, csvEscape(i.category), i.amount, csvEscape(i.note)].join(','));
  });
  lines.push('');

  lines.push('ACCOUNTS');
  lines.push(['Name','Type','Institution','Balance'].join(','));
  accounts.forEach(a => {
    lines.push([csvEscape(a.name), csvEscape(a.type), csvEscape(a.institution), a.balance].join(','));
  });
  lines.push('');

  lines.push('TRANSFERS');
  lines.push(['Date','From','To','Amount','Note'].join(','));
  transfers.forEach(tr => {
    const from = accounts.find(a=>a.id===tr.fromAccountId);
    const to = accounts.find(a=>a.id===tr.toAccountId);
    lines.push([tr.date, csvEscape(from?from.name:''), csvEscape(to?to.name:''), tr.amount, csvEscape(tr.note)].join(','));
  });
  lines.push('');

  lines.push('INVESTMENT TRANSACTIONS');
  lines.push(['Date','Symbol','Type','Shares','Price','Fees','Note'].join(','));
  investmentTxns.forEach(tx => {
    lines.push([tx.date, csvEscape(tx.symbol), csvEscape(tx.type), tx.shares, tx.price, tx.fees, csvEscape(tx.note)].join(','));
  });
  lines.push('');

  lines.push('FINANCIAL GOALS');
  lines.push(['Name','Type','Target','Current','Target Date','Monthly Contribution'].join(','));
  financialGoals.forEach(g => {
    lines.push([csvEscape(g.name), csvEscape(g.goalType), g.targetAmount, g.currentAmount, g.targetDate||'', g.monthlyContribution].join(','));
  });
  lines.push('');

  lines.push('TAX ENTRIES');
  lines.push(['Tax Year','Type','Description','Amount'].join(','));
  taxEntries.forEach(t => {
    lines.push([t.taxYear, csvEscape(t.entryType), csvEscape(t.description), t.amount].join(','));
  });

  const csvContent = lines.join('\n');
  const blob = new Blob([csvContent], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `moneta-compass-export-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function uploadAvatarFile(file){
  if(!file.type.startsWith('image/')){ alert('Please choose an image file.'); return; }
  try{
    const dataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const size = 300;
          const canvas = document.createElement('canvas');
          canvas.width = size; canvas.height = size;
          const ctx = canvas.getContext('2d');
          const scale = Math.max(size/img.width, size/img.height);
          const w = img.width*scale, h = img.height*scale;
          ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

    const res = await fetch(dataUrl);
    const blob = await res.blob();
    const path = `${currentUser.id}/avatar.jpg`;

    const { error: upErr } = await sb.storage.from('avatars').upload(path, blob, { contentType:'image/jpeg', upsert:true });
    if(upErr) throw upErr;

    await sb.from('profiles').update({ avatar_type:'upload', avatar_path:path, avatar_config:null }).eq('id', currentUser.id);
    const { data: signed } = await sb.storage.from('avatars').createSignedUrl(path, 3600);

    userProfile.avatarType = 'upload'; userProfile.avatarPath = path; userProfile.avatarConfig = null;
    userProfile.avatarUrl = signed ? signed.signedUrl : null;
    buildAccountMenu();
    renderSettings();
  }catch(err){
    alert(err.message || 'Could not upload that photo.');
  }
}

      await sb.from('profiles').update({ avatar_type:'none', avatar_config:null, avatar_path:null }).eq('id', currentUser.id);
      userProfile.avatarType = 'none'; userProfile.avatarConfig = null; userProfile.avatarPath = null; userProfile.avatarUrl = null;
      buildAccountMenu();

    });
  }

  document.getElementById('languageSelect').addEventListener('change', async (e) => {
    userSettings.language = e.target.value;
    applyDirection();
    await sb.from('user_settings').update({ language: userSettings.language }).eq('user_id', currentUser.id);
    render();
  });

  document.getElementById('currencySelect').addEventListener('change', async (e) => {

    await sb.from('user_settings').update({ currency: userSettings.currency }).eq('user_id', currentUser.id);
    await updateExchangeRate();

  });

  document.getElementById('passwordForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const newPassword = document.getElementById('newPasswordInput').value;
    const errorEl = document.getElementById('passwordError');
    const msgEl = document.getElementById('passwordMsg');

let watchlistRefreshTimer = null;
function openWatchlist(){
  view = "watchlist";
  render();
  fetchMissingQuotes();

  if(watchlistRefreshTimer) clearInterval(watchlistRefreshTimer);
  watchlistRefreshTimer = setInterval(() => {
    if(view !== "watchlist"){ clearInterval(watchlistRefreshTimer); watchlistRefreshTimer = null; return; }
    refreshAllQuotes();
  }, 30000);
}

async function addSymbol(presetSymbol){
  const input = document.getElementById('symbolInput');
  const symbol = (presetSymbol || input.value.trim()).toUpperCase();
  if(!symbol) return;
  if(watchlist.some(w => w.symbol === symbol)){ if(input) input.value=''; return; }

  const { data, error } = await sb.from('watchlist_items').insert({ user_id: currentUser.id, symbol }).select().single();
  if(error){ alert(error.message || 'Could not add that symbol.'); return; }
  watchlist.push({ id:data.id, symbol });
  renderWatchlist();
  await fetchQuote(symbol);
  if(view === "watchlist") renderWatchlist();
}

async function fetchQuote(symbol){
  try{
    const { data, error } = await sb.functions.invoke('finnhub-quote', { body: { endpoint:'quote', symbol } });
    if(error) throw error;
    if(!data || (data.c === 0 && data.d === null)){ quoteCache[symbol] = 'error'; return; }
    quoteCache[symbol] = { price:data.c, change:data.d, changePct:data.dp, high:data.h, low:data.l, open:data.o, prevClose:data.pc };
  }catch(e){
    quoteCache[symbol] = 'error';
  }
}

async function fetchMissingQuotes(){
  const missing = watchlist.filter(w => !quoteCache[w.symbol]);
  if(missing.length === 0) return;
  await Promise.all(missing.map(w => fetchQuote(w.symbol)));
  if(view === "watchlist") renderWatchlist();
}

async function refreshAllQuotes(){
  if(watchlist.length === 0) return;
  quoteCache = {};
  renderWatchlist();
  await Promise.all(watchlist.map(w => fetchQuote(w.symbol)));
  if(view === "watchlist") renderWatchlist();
}

function openPortfolio(){
  view = "portfolio";
  render();
  const missing = portfolio.filter(p => p.shares > 0.00001 && !quoteCache[p.symbol]);
  if(missing.length){
    Promise.all(missing.map(p => fetchQuote(p.symbol))).then(() => {
      if(view === "portfolio") renderPortfolio();
    });
  }
}

async function logTransaction(){
  const symbol = document.getElementById('txSymbol').value.trim().toUpperCase();
  const type = document.getElementById('txType').value;
  const date = document.getElementById('txDate').value || new Date().toISOString().slice(0,10);
  if(!symbol) return;

  let shares, price, fees = 0;
  if(type === 'dividend'){
    const amount = parseFloat(document.getElementById('txDividendAmount').value);
    if(!amount || amount <= 0) return;
    shares = 0; price = amount;
  }else{
    shares = parseFloat(document.getElementById('txShares').value);
    price = parseFloat(document.getElementById('txPrice').value);
    fees = parseFloat(document.getElementById('txFees').value) || 0;
    if(!shares || shares <= 0 || !price || price <= 0) return;

    if(type === 'sell'){
      const existing = portfolio.find(p => p.symbol === symbol);
      if(!existing || existing.shares < shares){
        alert(`You only hold ${existing ? existing.shares : 0} shares of ${symbol} — can't sell ${shares}.`);
        return;
      }
    }
  }

  const { data, error } = await sb.from('investment_transactions').insert({
    user_id: currentUser.id, symbol, type, shares, price, fees, date
  }).select().single();
  if(error){ alert(error.message || 'Could not log that transaction.'); return; }

  investmentTxns.push({ id:data.id, symbol, type, shares, price, fees, date, note:'' });
  portfolio = computeHoldings();
  renderPortfolio();
  await fetchQuote(symbol);
  if(view === "portfolio") renderPortfolio();
}

async function fetchStockDetails(symbol){
  const result = { marketCap:null, weekHigh52:null, weekLow52:null, nextEarnings:null, lastEarnings:null, ytdReturn:null };
  try{
    const { data, error } = await sb.functions.invoke('finnhub-quote', { body: { endpoint:'metric', symbol } });
    if(error) throw error;
    if(data && data.metric){
      result.marketCap = data.metric.marketCapitalization || null;
      result.weekHigh52 = data.metric['52WeekHigh'] || null;
      result.weekLow52 = data.metric['52WeekLow'] || null;
      result.ytdReturn = data.metric['yearToDatePriceReturnDaily'] != null ? data.metric['yearToDatePriceReturnDaily'] : null;
    }
  }catch(e){}

  try{
    const today = new Date();
    const future = new Date(); future.setDate(future.getDate() + 90);
    const fmt2 = d => d.toISOString().slice(0,10);
    const { data, error } = await sb.functions.invoke('finnhub-quote', { body: { endpoint:'calendar', symbol, from:fmt2(today), to:fmt2(future) } });
    if(error) throw error;
    if(data && data.earningsCalendar && data.earningsCalendar.length){
      result.nextEarnings = data.earningsCalendar[0];
    }
  }catch(e){}

  try{
    const { data, error } = await sb.functions.invoke('finnhub-quote', { body: { endpoint:'earnings', symbol } });
    if(error) throw error;
    if(data && data.length){
      result.lastEarnings = data[0];
    }
  }catch(e){}

  detailsCache[symbol] = result;
}

  const q = quoteCache[symbol];
  const d = detailsCache[symbol];

  let priceHtml = '<div class="detail-price">Loading…</div>';
  if(q && q !== 'error'){
    const dir = q.change > 0 ? 'up' : (q.change < 0 ? 'down' : '');

      <div class="detail-price">${fmtStock(q.price)}</div>

  }

  let rangesHtml = '';
  if(q && q !== 'error' && q.low != null && q.high != null){
    const dayPct = q.high > q.low ? ((q.price - q.low) / (q.high - q.low)) * 100 : 50;
    rangesHtml += `
      <div class="metric-box" style="grid-column:1 / -1;">
        <div class="metric-label">Day range</div>
        <div class="range-bar"><div class="range-fill" style="left:${dayPct}%;"></div></div>

      </div>`;
  }
  if(d && d.weekLow52 != null && d.weekHigh52 != null && q && q !== 'error'){
    const wPct = d.weekHigh52 > d.weekLow52 ? ((q.price - d.weekLow52) / (d.weekHigh52 - d.weekLow52)) * 100 : 50;
    const clamped = Math.max(0, Math.min(100, wPct));
    rangesHtml += `
      <div class="metric-box" style="grid-column:1 / -1;">
        <div class="metric-label">52-week range</div>
        <div class="range-bar"><div class="range-fill" style="left:${clamped}%;"></div></div>
        <div class="range-labels"><span>${fmtStock(d.weekLow52)}</span><span>${fmtStock(d.weekHigh52)}</span></div>
      </div>`;
  }

  let metricsHtml = '<div class="metric-grid">' + rangesHtml;
  if(d && d.marketCap != null){
    const convertedCap = d.marketCap * exchangeRate;
    metricsHtml += `
      <div class="metric-box">
        <div class="metric-label">Market cap</div>
        <div class="metric-value">${CURRENCY_SYMBOLS[userSettings.currency]||"$"}${(convertedCap >= 1000 ? (convertedCap/1000).toFixed(2)+'B' : convertedCap.toFixed(0)+'M')}</div>
      </div>`;
  }
  if(q && q !== 'error' && q.open != null){
    metricsHtml += `
      <div class="metric-box">
        <div class="metric-label">Open</div>
        <div class="metric-value">${fmtStock(q.open)}</div>
      </div>`;
  }
  if(d && d.ytdReturn != null){
    const ytdDir = d.ytdReturn > 0 ? 'up' : (d.ytdReturn < 0 ? 'down' : '');
    const ytdSign = d.ytdReturn > 0 ? '+' : '';
    metricsHtml += `
      <div class="metric-box">
        <div class="metric-label">YTD</div>
        <div class="metric-value holding-gain ${ytdDir}" style="font-size:16px;">${ytdSign}${d.ytdReturn.toFixed(2)}%</div>
      </div>`;
  }
  metricsHtml += '</div>';

  let earningsHtml = '<div class="section-label">Earnings</div>';
  if(d && d.nextEarnings){
    earningsHtml += `
      <div class="earnings-row">
        <div class="earnings-label">Next earnings date</div>
        <div class="earnings-value">${escapeHtml(d.nextEarnings.date || '—')}${d.nextEarnings.epsEstimate ? ` · est. EPS ${d.nextEarnings.epsEstimate}` : ''}</div>
      </div>`;
  }else{
    earningsHtml += `<div class="earnings-row"><div class="earnings-value">No upcoming earnings date found.</div></div>`;
  }
  if(d && d.lastEarnings){
    const actual = d.lastEarnings.actual, estimate = d.lastEarnings.estimate;
    let resultLabel = '';
    if(actual != null && estimate != null){
      resultLabel = actual >= estimate
        ? `<span class="beat">Beat estimate</span>`
        : `<span class="miss">Missed estimate</span>`;
    }
    earningsHtml += `
      <div class="earnings-row">
        <div class="earnings-label">Last quarter (${escapeHtml(d.lastEarnings.period || '')})</div>
        <div class="earnings-value">Actual EPS ${actual != null ? actual : '—'} vs. estimate ${estimate != null ? estimate : '—'} ${resultLabel}</div>
      </div>`;
  }else{
    earningsHtml += `<div class="earnings-row"><div class="earnings-value">No recent earnings data found.</div></div>`;
  }

  document.getElementById('mainArea').innerHTML = `
    <div class="detail-price-block">${priceHtml}</div>
    ${metricsHtml}
    ${earningsHtml}
    <p class="hero-body" style="font-size:12px;margin-top:18px;">Data from Finnhub. This is factual market data only — not a recommendation to buy, hold, or sell.</p>
  `;

  document.getElementById('backBtn').addEventListener('click', () => { view=detailReturnView; render(); });

  if(!q || q === 'error') fetchQuote(symbol).then(() => { if(view === "portfolioDetail") renderStockDetail(symbol); });
  if(!d) fetchStockDetails(symbol).then(() => { if(view === "portfolioDetail") renderStockDetail(symbol); });
}

const backdrop = document.getElementById('backdrop');

function setReceiptStatus(message){
  receiptStatus.textContent = message || '';
}

// Reads receipt text via free, on-device OCR (Tesseract.js) — no API key,
// no server, and no per-scan cost, since nothing leaves the browser.
function parseReceiptText(text){
  const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);

  let total = null;
  const totalPatterns = [
    /(?:grand\s*total|total\s*due|amount\s*due|balance\s*due|total)[^0-9$€£﷼]*([$€£﷼]?\s*\d+[\d,]*\.\d{2})/i,
    /([$€£﷼]?\s*\d+[\d,]*\.\d{2})\s*$/i
  ];
  for(const line of lines){
    for(const re of totalPatterns){
      const m=line.match(re);
      if(m){
        const n=Number(m[1].replace(/[^0-9.]/g,'').replace(/,(?=\d{3}\b)/g,''));
        if(Number.isFinite(n) && n>0){ total=n; break; }
      }
    }
    if(total !== null) break;
  }

  let date = null;
  const dateRegexes = [
    /\b(20\d{2})[-\/](\d{1,2})[-\/](\d{1,2})\b/,
    /\b(\d{1,2})[-\/](\d{1,2})[-\/](20\d{2})\b/,
    /\b(\d{1,2})\s+([A-Za-z]{3,9})\s+(20\d{2})\b/i
  ];
  const months={jan:1,january:1,feb:2,february:2,mar:3,march:3,apr:4,april:4,may:5,jun:6,june:6,jul:7,july:7,aug:8,august:8,sep:9,sept:9,september:9,oct:10,october:10,nov:11,november:11,dec:12,december:12};
  for(const line of lines){
    let m=line.match(dateRegexes[0]);
    if(m){ date=`${m[1]}-${pad2(m[2])}-${pad2(m[3])}`; break; }
    m=line.match(dateRegexes[1]);
    if(m){
      const a=Number(m[1]), b=Number(m[2]), y=m[3];
      const mm = a>12 ? b : b>12 ? a : a;
      const dd = a>12 ? a : b>12 ? b : b;
      date=`${y}-${pad2(mm)}-${pad2(dd)}`; break;
    }
    m=line.match(dateRegexes[2]);
    if(m){ const mm=months[m[2].toLowerCase()]; if(mm) { date=`${m[3]}-${pad2(mm)}-${pad2(m[1])}`; break; } }
  }

  const merchantExclusions=/^(receipt|invoice|store|date|time|cashier|subtotal|total|tax|visa|mastercard|amex|debit|credit|thank|welcome|www\.|http)/i;
  let merchant='';
  for(const line of lines.slice(0,10)){
    if(line.length>=2 && !merchantExclusions.test(line) && !/^[$€£﷼]?\s*\d[\d,]*[.]?\d*$/.test(line)) {
      merchant=line.replace(/[^\w&.'’()\- ]/g,' ').replace(/\s+/g,' ').trim();
      if(merchant.length>=2) break;
    }
  }

  const all=lines.join(' ').toLowerCase();
  let category='Other';
  if(/rent|mortgage|landlord|property management/.test(all)) category='Rent/Mortgage';
  else if(/walmart|costco|loblaw|no frills|sobeys|metro|grocery|grocer|whole foods|food basics/.test(all)) category='Food';
  else if(/uber|lyft|shell|esso|petro|gas station|parking|transit|ttc/.test(all)) category='Transport';
  else if(/pharmacy|rexall|shoppers drug mart|clinic|dental|health/.test(all)) category='Health';
  else if(/netflix|spotify|cinema|movie|restaurant|starbucks|mcdonald|tim hortons/.test(all)) category='Fun';
  else if(/home depot|ikea|wayfair|furniture/.test(all)) category='Housing';
  else if(/hydro|enbridge|bell|rogers|telus|internet|utility/.test(all)) category='Utilities';
  else if(/amazon|best buy|winners|mall|shopping/.test(all)) category='Shopping';

  return {merchant,total,date,category};
}

async function scanReceipt(file){
  if(!file) return;
  if(!window.Tesseract){ setReceiptStatus('Receipt scanner is still loading. Please try again.'); return; }
  if(!file.type.startsWith('image/')){ setReceiptStatus('Please choose an image file.'); return; }
  scanReceiptBtn.disabled = true;
  addSubmitBtn.disabled = true;
  setReceiptStatus('Reading receipt… this can take a little while on the first scan.');
  receiptPreview.src = URL.createObjectURL(file);
  receiptPreview.classList.add('show');
  try{
    if(!receiptWorker){
      receiptWorker = await Tesseract.createWorker('eng');
    }
    const { data } = await receiptWorker.recognize(file);
    const parsed = parseReceiptText(data.text || '');

    if(parsed.total !== null) document.getElementById('amount').value = parsed.total.toFixed(2);
    if(parsed.date){
      const parts=parsed.date.split('-');
      document.getElementById('monthPicker').value=`${parts[0]}-${parts[1]}`;
      document.getElementById('dayPicker').value=Number(parts[2]);
    }
    refreshCategoryOptions(document.getElementById('category'), parsed.category);
    if(parsed.merchant){ document.getElementById('note').value = parsed.merchant; }

    const found=[];
    if(parsed.merchant) found.push(`merchant: ${parsed.merchant}`);
    if(parsed.total !== null) found.push(`total: ${fmt(parsed.total)}`);
    if(parsed.date) found.push(`date: ${parsed.date}`);
    setReceiptStatus(found.length ? `Found ${found.join(' • ')}. Please review before saving.` : 'Could not confidently find the total/date. Please review the fields manually.');
  }catch(err){
    console.error(err);
    setReceiptStatus('Could not read this receipt. Try a clearer, well-lit photo.');
  }finally{
    scanReceiptBtn.disabled = false;
    addSubmitBtn.disabled = false;
  }
}

function refreshCategoryOptions(selectEl, currentValue){
  const allCats = CATEGORY_ORDER.concat(customCategories.filter(c => !CATEGORY_ORDER.includes(c)));
  let html = allCats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  html += `<option value="__new__">+ Add new category…</option>`;
  selectEl.innerHTML = html;
  if(currentValue && allCats.includes(currentValue)) selectEl.value = currentValue;
}

function ensureCategoryColor(cat){
  if(!CATEGORY_COLORS[cat]){
    const palette = ["#7A6F8A","#4A7C8C","#8C6B4A","#6B8C4A","#8C4A6B"];
    CATEGORY_COLORS[cat] = palette[Object.keys(CATEGORY_COLORS).length % palette.length];
  }
}

document.getElementById('category').addEventListener('change', async (e) => {
  if(e.target.value === '__new__'){
    const name = prompt('New category name:');
    if(name && name.trim()){
      const trimmed = name.trim();
      if(!customCategories.includes(trimmed) && !CATEGORY_ORDER.includes(trimmed)){
        const { data, error } = await sb.from('custom_categories').insert({ user_id: currentUser.id, name: trimmed }).select().single();
        if(!error){ customCategories.push(trimmed); ensureCategoryColor(trimmed); }
      }
      refreshCategoryOptions(e.target, trimmed);
    }else{
      refreshCategoryOptions(e.target, 'Other');
    }
  }
});

let entryType = 'expense'; // 'expense' | 'income'
let editingEntry = null; // { type:'expense'|'income', id } or null when adding new

function setEntryType(newType){
  entryType = newType;
  document.getElementById('tabExpense').textContent = t('expenseTab');
  document.getElementById('tabIncome').textContent = t('incomeTab');
  document.getElementById('tabExpense').classList.toggle('active', newType==='expense');
  document.getElementById('tabIncome').classList.toggle('active', newType==='income');
  document.getElementById('modalTitle').textContent = editingEntry
    ? (newType==='expense' ? 'Edit expense' : 'Edit income')
    : (newType==='expense' ? t('addExpense') : t('addIncome'));
  document.getElementById('addSubmitBtn').textContent = editingEntry ? 'Save changes' : (newType==='expense' ? t('addExpense') : t('addIncome'));
  document.getElementById('receiptSection').style.display = (newType==='expense' && !editingEntry) ? 'block' : 'none';
  document.getElementById('recurringSection').style.display = (newType==='expense' && !editingEntry) ? 'flex' : 'none';
  const tabsEl = document.getElementById('tabExpense').parentElement;
  if(tabsEl) tabsEl.style.display = editingEntry ? 'none' : 'flex';
  const categorySelect = document.getElementById('category');
  if(newType==='income'){
    categorySelect.innerHTML = INCOME_CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('');
  }else{
    refreshCategoryOptions(categorySelect, 'Rent/Mortgage');
  }
}
document.getElementById('tabExpense').addEventListener('click', () => setEntryType('expense'));
document.getElementById('monthPicker').addEventListener('change', () => renderCalendarGrid());
document.getElementById('tabIncome').addEventListener('click', () => setEntryType('income'));

function openModal(){
  editingEntry = null;
  document.getElementById('monthPicker').value = (view==="detail" && activeMonth) ? activeMonth : currentMonthKey();
  renderCalendarGrid();
  document.getElementById('recurringCheck').checked = false;
  document.getElementById('amount').value = '';
  document.getElementById('note').value = '';
  setEntryType('expense');
  const acctSelect = document.getElementById('entryAccount');
  if(accounts.length === 0){
    acctSelect.innerHTML = `<option value="">No accounts yet — add one from the Accounts page</option>`;
  }else{
    acctSelect.innerHTML = accounts.map(a => `<option value="${a.id}">${escapeHtml(a.name)} (${a.type})</option>`).join('');
  }
  receiptInput.value=''; receiptPreview.src=''; receiptPreview.classList.remove('show'); setReceiptStatus('');
  backdrop.classList.add('open');
  document.getElementById('amount').focus();
}

function openEditModal(type, entry){
  editingEntry = { type, id: entry.id };
  setEntryType(type);

  const acctSelect = document.getElementById('entryAccount');
  if(accounts.length === 0){
    acctSelect.innerHTML = `<option value="">No accounts yet — add one from the Accounts page</option>`;
  }else{
    acctSelect.innerHTML = accounts.map(a => `<option value="${a.id}">${escapeHtml(a.name)} (${a.type})</option>`).join('');
  }

  document.getElementById('amount').value = entry.amount;
  document.getElementById('category').value = entry.category;
  document.getElementById('monthPicker').value = entry.date.slice(0,7);
  renderCalendarGrid(parseInt(entry.date.slice(8,10),10));
  document.getElementById('note').value = entry.note || '';
  if(entry.accountId) acctSelect.value = entry.accountId;
  document.getElementById('recurringCheck').checked = false;

  backdrop.classList.add('open');
  document.getElementById('amount').focus();
}

function closeModal(){
  backdrop.classList.remove('open'); entryForm.reset();
  editingEntry = null;
  receiptInput.value=''; receiptPreview.src=''; receiptPreview.classList.remove('show'); setReceiptStatus('');
}
fabAdd.addEventListener('click', openModal);
cancelBtn.addEventListener('click', closeModal);
scanReceiptBtn.addEventListener('click', () => receiptInput.click());
receiptInput.addEventListener('change', () => { const file=receiptInput.files && receiptInput.files[0]; scanReceipt(file); });
backdrop.addEventListener('click', (e) => { if(e.target === backdrop) closeModal(); });

entryForm.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const amount = parseFloat(document.getElementById('amount').value);
  if(!amount || amount <= 0) return;
  const monthVal = document.getElementById('monthPicker').value;
  if(!monthVal) return;
  let day = parseInt(document.getElementById('dayPicker').value,10);
  if(!day || day<1) day=1; if(day>31) day=31;
  const category = document.getElementById('category').value;
  const note = document.getElementById('note').value.trim();
  const isRecurring = entryType==='expense' && !editingEntry && document.getElementById('recurringCheck').checked;
  const date = `${monthVal}-${pad2(day)}`;
  const accountId = document.getElementById('entryAccount').value || null;

  addSubmitBtn.disabled = true;
  try{
    if(editingEntry){
      const table = editingEntry.type === 'income' ? 'income_entries' : 'expenses';
      const { error } = await sb.from(table).update({ amount, category, note, date, account_id: accountId }).eq('id', editingEntry.id);
      if(error) throw error;
      const arr = editingEntry.type === 'income' ? incomeEntries : expenses;
      const item = arr.find(x => x.id === editingEntry.id);
      if(item){ item.amount=amount; item.category=category; item.note=note; item.date=date; item.accountId=accountId; }
    }else if(entryType === 'income'){
      const { data, error } = await sb.from('income_entries').insert({
        user_id: currentUser.id, amount, category, note, date, account_id: accountId
      }).select().single();
      if(error) throw error;
      incomeEntries.push({ id:data.id, amount, category, note, date, accountId });
    }else if(isRecurring){
      const { data, error } = await sb.from('recurring_templates').insert({
        user_id: currentUser.id, amount, category, note, day, start_month: monthVal, skipped_months: [], account_id: accountId
      }).select().single();
      if(error) throw error;
      recurringTemplates.push({ id:data.id, amount, category, note, day, startMonth:monthVal, skippedMonths:[], accountId });
      const newOnes = generateRecurringEntries();
      if(newOnes.length) await insertGeneratedEntries(newOnes);
    }else{
      const { data, error } = await sb.from('expenses').insert({
        user_id: currentUser.id, amount, category, note, date, account_id: accountId
      }).select().single();
      if(error) throw error;
      expenses.push({ id:data.id, amount, category, note, date, accountId });
    }
    activeMonth = monthVal;
    view = "detail";
    render();
    closeModal();
  }catch(err){
    alert(err.message || 'Could not save that entry. Try again.');
  }finally{
    addSubmitBtn.disabled = false;
  }
});

boot();
