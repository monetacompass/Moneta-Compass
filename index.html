<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moneta Compass</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root{
    --paper: #EDE8DC;
    --paper-line: #CFC6B0;
    --ink: #22281F;
    --ink-soft: #5C5F52;
    --moss: #55694A;
    --rust: #A8462F;
    --card: #F6F3EA;
    --input-bg: #FFFFFF;
    --font-serif: "Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
    --font-sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  html[data-theme="dark"]{
    --paper: #1C201A;
    --paper-line: #3A4034;
    --ink: #EDE8DC;
    --ink-soft: #A9A392;
    --moss: #7FA06B;
    --rust: #E08A6D;
    --card: #262B22;
    --input-bg: #2A2F26;
  }
  html, body{ transition: background 0.2s, color 0.2s; }
  html{ overflow-x:hidden; }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family: var(--font-serif);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-text-size-adjust:100%;
  }
  .wrap{ max-width:480px; margin:0 auto; padding:24px 18px 110px; position:relative; transition:max-width 0.2s; width:100%; }
  @media (min-width:720px){ .wrap{ max-width:760px; padding:40px 32px 110px; } }
  @media (min-width:1080px){ .wrap{ max-width:1040px; padding:48px 40px 110px; } }
  .masthead{
    border-bottom:2px solid var(--ink); padding-bottom:12px; margin-bottom:22px;
  }
  .masthead-top{
    display:flex; align-items:center; justify-content:space-between; min-height:34px; gap:10px;
  }
  .masthead h1{ font-family:var(--font-serif); font-size:21px; font-weight:600; letter-spacing:0.2px; margin:0; display:flex; align-items:center; gap:10px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .back-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:50%; flex-shrink:0;
    background:var(--card); border:1px solid var(--paper-line);
    font-family:inherit; font-size:17px; color:var(--ink); cursor:pointer; padding:0; line-height:1;
    transition:border-color 0.15s, background 0.15s;
  }
  .back-btn:hover{ border-color:var(--moss); background:var(--paper); }
  .navlinks{
    display:flex; align-items:center; gap:6px; margin-top:12px;
    overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:2px;
  }
  .navlinks::-webkit-scrollbar{ display:none; }
  .navlink{
    font-family:var(--font-sans); font-size:12.5px; font-weight:500; color:var(--ink-soft);
    background:var(--card); border:1px solid var(--paper-line); border-radius:999px;
    padding:7px 13px; cursor:pointer; white-space:nowrap; flex-shrink:0;
    transition:border-color 0.15s, color 0.15s;
  }
  .navlink:hover{ border-color:var(--moss); color:var(--ink); }

  /* ---- Auth view ---- */
  .login-intro{ font-family:var(--font-sans); font-size:15px; line-height:1.55; color:var(--ink-soft); margin:0 0 22px; }
  .auth-card{
    background:var(--card); border:1px solid var(--paper-line); border-radius:12px;
    padding:22px 20px; box-shadow:0 2px 14px rgba(34,40,31,0.06);
  }
  .auth-tabs{ display:flex; gap:6px; margin-bottom:18px; }
  .auth-tab{
    flex:1; padding:9px; text-align:center; background:var(--card); border:1px solid var(--paper-line);
    font-family:var(--font-sans); font-size:13.5px; font-weight:500; color:var(--ink-soft); cursor:pointer; border-radius:8px;
  }
  .auth-tab.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .login-error{ font-family:var(--font-sans); font-size:12.5px; color:var(--rust); margin:8px 0 0; min-height:16px; }
  .login-msg{ font-family:var(--font-sans); font-size:13px; color:var(--moss); margin:8px 0 0; min-height:16px; }
  .login-note{
    font-family:var(--font-sans); font-size:12px; color:var(--ink-soft); line-height:1.5; margin-top:18px;
    padding-top:14px; border-top:1px solid var(--paper-line);
  }

  /* ---- Home / hero view ---- */
  .hero-eyebrow{ font-family:var(--font-sans); font-size:13px; font-weight:600; letter-spacing:0.3px; text-transform:uppercase; color:var(--moss); margin-bottom:8px; }
  .hero-headline{ font-size:28px; line-height:1.22; font-weight:600; letter-spacing:-0.2px; margin:0 0 14px; }
  .hero-body{ font-family:var(--font-sans); font-size:15px; line-height:1.6; color:var(--ink-soft); margin:0 0 22px; max-width:60ch; }
  .hero-stat{
    background:var(--card); border:1px solid var(--paper-line); border-radius:8px;
    padding:14px 16px; margin-bottom:26px; display:flex; align-items:baseline; justify-content:space-between;
  }
  .hero-stat .label{ font-family:var(--font-sans); font-size:12px; color:var(--ink-soft); }
  .hero-stat .value{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:20px; }
  .tip-row{ display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--paper-line); }
  .tip-row .dot{ width:8px; height:8px; border-radius:50%; margin-top:7px; flex-shrink:0; background:var(--moss); }
  .tip-icon-badge{
    width:34px; height:34px; border-radius:50%; flex-shrink:0;
    background:var(--card); border:1px solid var(--paper-line); color:var(--moss);
    display:flex; align-items:center; justify-content:center;
  }
  .tip-icon-num{ font-family:var(--font-sans); font-size:14px; font-weight:700; color:var(--paper); background:var(--moss); border-color:var(--moss); }
  .tip-title{ font-size:15.5px; margin-bottom:2px; }
  .tip-body{ font-size:13.5px; color:var(--ink-soft); line-height:1.5; }
  .cta{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; text-align:center; margin-top:28px; padding:15px;
    background:var(--ink); color:var(--paper); border:none; font-family:var(--font-sans);
    font-size:15px; font-weight:600; border-radius:8px; cursor:pointer;
    transition:opacity 0.15s;
  }
  .cta svg{ flex-shrink:0; }
  .cta:hover{ opacity:0.88; }

  /* ---- Months list view ---- */
  .month-card{ display:flex; align-items:center; justify-content:space-between; padding:16px 4px; border-bottom:1px solid var(--paper-line); cursor:pointer; }
  .month-card:hover .month-name{ color:var(--moss); }
  .month-name{ font-size:17px; }
  .month-meta{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .month-amount{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:19px; font-weight:600; }
  .chev{ color:var(--ink-soft); margin-left:10px; font-size:14px; }
  .month-row-right{ display:flex; align-items:center; }

  .empty{ text-align:center; color:var(--ink-soft); font-size:14px; padding:40px 10px; border:1px dashed var(--paper-line); border-radius:2px; margin-top:10px; }
  .loading{ text-align:center; color:var(--ink-soft); font-size:13px; padding:20px; }

  /* ---- Month detail view ---- */
  .total-block{ margin-bottom:34px; }
  .total-label{ font-size:13px; color:var(--ink-soft); margin-bottom:6px; }
  .total-amount{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:48px; font-weight:700; line-height:1; letter-spacing:-1px; }
  .section-label{ font-family:var(--font-sans); font-size:13px; text-transform:uppercase; letter-spacing:0.6px; color:var(--ink); font-weight:600; margin: 34px 0 14px; padding-bottom:8px; border-bottom:1.5px solid var(--paper-line); }
  .day-heading{ font-size:12px; color:var(--ink-soft); margin:16px 0 4px; }
  .entry-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--paper-line); }
  .entry-row .dot{ width:8px;height:8px;border-radius:50%; flex-shrink:0; }
  .entry-info{ flex:1; min-width:0; }
  .entry-cat{ font-size:14.5px; display:flex; align-items:center; gap:6px; }
  .recur-badge{ font-size:11px; color:var(--ink-soft); }
  .entry-note{ font-size:12px; color:var(--ink-soft); }
  .entry-amount{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:16px; font-weight:500; white-space:nowrap; }
  .entry-del{ background:none; border:none; color:var(--ink-soft); font-size:16px; cursor:pointer; padding:4px 2px; line-height:1; }
  .entry-del:hover{ color:var(--rust); }

  /* ---- Recurring page ---- */
  .recur-card{ padding:14px 4px; border-bottom:1px solid var(--paper-line); display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .recur-name{ font-size:15.5px; }
  .recur-meta{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .recur-amount{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:17px; font-weight:500; margin-right:8px; }
  .stop-btn{
    background:transparent; border:1px solid var(--paper-line); color:var(--ink-soft);
    font-family:var(--font-sans); font-size:11.5px; padding:6px 10px; border-radius:2px; cursor:pointer; white-space:nowrap;
  }
  .stop-btn:hover{ border-color:var(--rust); color:var(--rust); }

  /* ---- Watchlist page ---- */
  .add-symbol-row{ display:flex; gap:8px; margin-bottom:18px; }
  .add-symbol-row input{ text-transform:uppercase; }
  .add-symbol-row button{
    flex:0 0 auto; padding:0 16px; background:var(--ink); color:var(--paper); border:none;
    font-family:inherit; font-size:14px; font-weight:600; border-radius:2px; cursor:pointer;
  }
  .add-symbol-row button:disabled{ opacity:0.5; cursor:default; }
  .stock-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 4px; border-bottom:1px solid var(--paper-line);
  }
  .stock-symbol{ font-size:16px; font-weight:600; }
  .stock-meta{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .stock-right{ display:flex; align-items:center; gap:10px; }
  .stock-price{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:19px; font-weight:600; text-align:right; }
  .stock-change{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:12.5px; text-align:right; }
  .stock-change.up{ color:var(--moss); } .stock-change.up::before{ content:"▲ "; font-size:9px; }
  .stock-change.down{ color:var(--rust); } .stock-change.down::before{ content:"▼ "; font-size:9px; }
  .stock-del{ background:none; border:none; color:var(--ink-soft); font-size:15px; cursor:pointer; padding:2px 4px; }
  .stock-del:hover{ color:var(--rust); }
  .refresh-link{ font-size:12px; }

  /* ---- Portfolio page ---- */
  .holding-row{
    padding:14px 4px; border-bottom:1px solid var(--paper-line);
    display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer;
  }
  .holding-symbol{ font-size:16px; font-weight:600; }
  .holding-meta{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .holding-value{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:18px; font-weight:600; text-align:right; }
  .holding-gain{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:12.5px; text-align:right; }
  .holding-gain.up{ color:var(--moss); } .holding-gain.up::before{ content:"▲ "; font-size:9px; }
  .holding-gain.down{ color:var(--rust); } .holding-gain.down::before{ content:"▼ "; font-size:9px; }
  .portfolio-total{
    background:var(--card); border:1px solid var(--paper-line); border-radius:6px;
    padding:22px 20px; margin-bottom:28px; box-shadow:0 2px 10px rgba(34,40,31,0.06);
  }
  .portfolio-total .label{ font-size:13px; color:var(--ink-soft); }
  .portfolio-total .value{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:38px; font-weight:700; margin-top:6px; letter-spacing:-0.5px; }
  .portfolio-total .sub{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:13px; margin-top:6px; }

  /* ---- Stock detail page ---- */
  .detail-price-block{ margin-bottom:28px; }
  .detail-price{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:48px; font-weight:700; letter-spacing:-1px; }
  .detail-change{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:15px; margin-top:6px; }
  .metric-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:22px;
  }
  .metric-box{ background:var(--card); border:1px solid var(--paper-line); border-radius:8px; padding:14px 16px; }
  .metric-label{ font-size:11px; color:var(--ink-soft); margin-bottom:3px; }
  .metric-value{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:16px; }
  .range-bar{
    position:relative; height:8px; background:var(--paper-line); border-radius:4px; margin:8px 0 4px;
  }
  .range-fill{ position:absolute; top:-3px; width:14px; height:14px; border-radius:50%; background:var(--ink); transform:translateX(-50%); }
  .range-labels{ display:flex; justify-content:space-between; font-size:11px; color:var(--ink-soft); }
  .earnings-row{ padding:12px 4px; border-bottom:1px solid var(--paper-line); }
  .earnings-label{ font-size:12px; color:var(--ink-soft); margin-bottom:2px; }
  .earnings-value{ font-size:15px; }
  .beat{ color:var(--moss); } .miss{ color:var(--rust); }

  /* ---- Budget progress ---- */
  .budget-row{ padding:10px 0; }
  .budget-top{ display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:5px; }
  .budget-track{ height:8px; background:var(--paper-line); border-radius:4px; overflow:hidden; }
  .budget-fill{ height:100%; border-radius:4px; }
  .budget-fill.ok{ background:var(--moss); }
  .budget-fill.over{ background:var(--rust); }

  /* ---- Dashboard tiles (home page) ---- */
  .dashboard-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin:20px 0 28px;
  }
  @media (min-width:600px){ .dashboard-grid{ grid-template-columns:repeat(3,1fr); } }
  @media (min-width:1080px){ .dashboard-grid{ grid-template-columns:repeat(5,1fr); } }
  .dashboard-tile{
    background:var(--card); border:1px solid var(--paper-line); border-radius:8px;
    padding:20px 14px; text-align:center; cursor:pointer; transition:border-color 0.15s, transform 0.15s;
  }
  .dashboard-tile:hover{ border-color:var(--moss); transform:translateY(-1px); }
  .dashboard-tile .tile-icon{ display:flex; justify-content:center; margin-bottom:10px; color:var(--ink); }
  .dashboard-tile .tile-label{ font-family:var(--font-sans); font-size:13.5px; font-weight:600; }
  .dashboard-tile .tile-sub{ font-family:var(--font-sans); font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .feature-detail-panel{
    grid-column: 1 / -1;
    background:var(--card); border:1px solid var(--moss); border-radius:8px;
    padding:16px 18px; margin:2px 0 4px;
  }

  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:32px; }
  @media (min-width:600px){ .stat-grid{ grid-template-columns:repeat(3,1fr); } }
  .stat-card{ background:var(--card); border:1px solid var(--paper-line); border-radius:6px; padding:18px 18px; }
  .stat-card .label{ font-family:var(--font-sans); font-size:12px; color:var(--ink-soft); }
  .stat-card .value{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:23px; font-weight:600; margin-top:6px; }

  @media (min-width:720px){
    .hero-headline{ font-size:36px; }
    .hero-body{ max-width:70ch; }
  }

  /* ---- Net worth page ---- */
  .networth-summary{
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; margin-bottom:32px;
  }
  @media (max-width:600px){ .networth-summary{ grid-template-columns:1fr; } }
  .nw-card{ background:var(--card); border:1px solid var(--paper-line); border-radius:6px; padding:18px 18px; }
  .nw-card.highlight{ background:var(--ink); border-color:var(--ink); box-shadow:0 4px 16px rgba(34,40,31,0.18); }
  .nw-card.highlight .label{ color:#c9c4b5; }
  .nw-card.highlight .value{ color:var(--paper); font-size:30px; }
  .nw-card .label{ font-size:12px; color:var(--ink-soft); }
  .nw-card .value{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:24px; font-weight:600; margin-top:6px; }
  .nw-item-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 4px; border-bottom:1px solid var(--paper-line);
  }
  .nw-item-label{ font-size:14.5px; }
  .nw-item-balance{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:15px; }

  /* ---- Donut charts ---- */
  .charts-row{ display:flex; flex-wrap:wrap; gap:24px; margin-bottom:24px; }
  .chart-block{ flex:1; min-width:220px; }
  .chart-block-inner{ display:flex; align-items:center; gap:18px; }
  .chart-title{ font-size:12px; color:var(--ink-soft); margin-bottom:10px; }
  .chart-center-label{ text-align:center; }
  .legend-list{ flex:1; min-width:0; }
  .legend-row{ display:flex; align-items:center; gap:8px; padding:5px 0; font-size:12.5px; }
  .legend-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .legend-label{ flex:1; color:var(--ink); }
  .legend-value{ color:var(--ink-soft); font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:11.5px; white-space:nowrap; }

  /* ---- Analytics ---- */
  .trend-row{ display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--paper-line); font-size:14px; }
  .trend-row.total{ font-weight:600; }
  .trend-pct{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:13.5px; font-weight:600; }
  .trend-pct.up{ color:var(--rust); } .trend-pct.up::before{ content:"▲ "; font-size:9px; }
  .trend-pct.down{ color:var(--moss); } .trend-pct.down::before{ content:"▼ "; font-size:9px; }
  .trend-pct.flat{ color:var(--ink-soft); }
  .insight-card{
    background:var(--card); border:1px solid var(--paper-line); border-left:3px solid var(--moss);
    border-radius:6px; padding:12px 16px; margin-bottom:10px; font-size:13.5px; line-height:1.5;
  }

  /* ---- Contact footer ---- */
  .contact-footer{
    margin-top:36px; padding-top:20px; border-top:1px solid var(--paper-line);
    text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .contact-label{ font-family:var(--font-sans); font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.5px; }
  .contact-x-link{
    display:inline-flex; align-items:center; justify-content:center;
    width:40px; height:40px; border-radius:50%; background:var(--ink); color:var(--paper);
    transition:opacity 0.15s;
  }
  .contact-x-link:hover{ opacity:0.85; }

  /* ---- Floating add button ---- */
  .fab{
    position:fixed; right:calc(50% - 240px + 20px); bottom:26px;
    background:var(--ink); color:var(--paper); border:none; border-radius:999px;
    height:52px; padding:0 22px; font-size:15px; font-weight:600; font-family:inherit; cursor:pointer;
    box-shadow:0 4px 14px rgba(34,40,31,0.35);
    display:flex; align-items:center; gap:8px;
  }
  .fab .fab-icon{ font-size:19px; line-height:1; }
  @media (max-width: 520px){ .fab{ right:20px; } }
  @media (min-width:720px){ .fab{ right:calc(50% - 380px + 20px); } }
  @media (min-width:1080px){ .fab{ right:calc(50% - 520px + 20px); } }
  html[dir="rtl"] .fab{ right:auto; left:calc(50% - 240px + 20px); }
  @media (max-width: 520px){ html[dir="rtl"] .fab{ left:20px; } }
  @media (min-width:720px){ html[dir="rtl"] .fab{ left:calc(50% - 380px + 20px); } }
  @media (min-width:1080px){ html[dir="rtl"] .fab{ left:calc(50% - 520px + 20px); } }

  /* ---- Modal ---- */
  .backdrop{ position:fixed; inset:0; background:rgba(34,40,31,0.45); display:none; align-items:flex-end; justify-content:center; z-index:10; }
  .backdrop.open{ display:flex; }
  .modal{ background:var(--card); width:100%; max-width:480px; border-radius:10px 10px 0 0; padding:20px 20px 24px; border-top:1px solid var(--paper-line); max-height:90vh; overflow-y:auto; }
  .modal h2{ font-size:17px; margin:0 0 14px; }
  .row{ display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .row > .field{ min-width:120px; }
  .row:last-of-type{ margin-bottom:0; }
  .field{ flex:1; display:flex; flex-direction:column; gap:4px; }
  .field label{ font-family:var(--font-sans); font-size:11px; color:var(--ink-soft); }
  input, select{
    font-family:var(--font-sans); font-size:15px; padding:9px 11px; border:1px solid var(--paper-line);
    background:var(--input-bg); color:var(--ink); border-radius:6px; width:100%;
  }
  input:focus, select:focus{ outline:2px solid var(--moss); outline-offset:-1px; }

function nextMonthKey(key){ let [y,m]=key.split('-').map(Number); m++; if(m>12){m=1;y++;} return `${y}-${pad2(m)}`; }
function shiftMonthKey(key, delta){
  let [y,m] = key.split('-').map(Number);
  m += delta;
  while(m > 12){ m -= 12; y++; }
  while(m < 1){ m += 12; y--; }
  return `${y}-${pad2(m)}`;

// Compares a month's spending to the prior month and a 3-month trailing
// average, both overall and per category, and surfaces the most notable
// changes as plain-language insights.
function computeAnalytics(monthKey){
  const prevMonthKey = shiftMonthKey(monthKey, -1);
  const curEntries = expenses.filter(e => e.date.slice(0,7) === monthKey);
  const prevEntries = expenses.filter(e => e.date.slice(0,7) === prevMonthKey);
  const curTotal = curEntries.reduce((s,e)=>s+e.amount,0);
  const prevTotal = prevEntries.reduce((s,e)=>s+e.amount,0);
  const totalChangePct = prevTotal > 0 ? ((curTotal-prevTotal)/prevTotal*100) : null;

  const cats = new Set([...curEntries.map(e=>e.category), ...prevEntries.map(e=>e.category)]);
  const categoryChanges = [...cats].map(cat => {
    const curAmt = curEntries.filter(e=>e.category===cat).reduce((s,e)=>s+e.amount,0);
    const prevAmt = prevEntries.filter(e=>e.category===cat).reduce((s,e)=>s+e.amount,0);
    let pct = null;
    if(prevAmt > 0) pct = ((curAmt-prevAmt)/prevAmt*100);
    else if(curAmt > 0) pct = null; // no prior baseline — show as "New" rather than a misleading %
    return { cat, curAmt, prevAmt, pct };
  }).filter(c => c.curAmt > 0 || c.prevAmt > 0)
    .sort((a,b) => Math.abs(b.pct==null?0:b.pct) - Math.abs(a.pct==null?0:a.pct));

  const trailingMonths = [1,2,3].map(n => shiftMonthKey(monthKey, -n));
  const insights = [];
  cats.forEach(cat => {
    const curAmt = curEntries.filter(e=>e.category===cat).reduce((s,e)=>s+e.amount,0);
    let sum = 0;
    trailingMonths.forEach(mk => {
      sum += expenses.filter(e => e.date.slice(0,7)===mk && e.category===cat).reduce((s,e)=>s+e.amount,0);
    });
    const avg3mo = sum / 3;
    const diff = curAmt - avg3mo;
    if(diff > 15 && avg3mo > 0){
      insights.push({ cat, diff, curAmt, avg3mo });
    }
  });
  insights.sort((a,b) => b.diff - a.diff);

  return { totalChangePct, categoryChanges, insights: insights.slice(0,2), curTotal, prevTotal };
}

function donutChartSVG(segments, opts){
  opts = opts || {};
  const size = opts.size || 200;
  const stroke = opts.stroke || 30;
  const radius = (size - stroke) / 2;
  const cx = size / 2, cy = size / 2;
  const circumference = 2 * Math.PI * radius;
  const total = segments.reduce((s,seg) => s + seg.value, 0);
  const sorted = [...segments].filter(s=>s.value>0).sort((a,b) => b.value - a.value);
  const gapPx = sorted.length > 1 ? 4 : 0;

  const centerLabel = opts.centerLabel ? `
    <text x="${cx}" y="${cy-8}" text-anchor="middle" font-size="12" fill="var(--ink-soft)" font-family="var(--font-sans)" letter-spacing="0.3px">${opts.centerLabel}</text>
    <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="21" font-weight="700" fill="var(--ink)" font-family="ui-monospace, SF Mono, Menlo, monospace">${opts.centerValue||''}</text>` : '';

  if(total <= 0){
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
      <circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="var(--paper-line)" stroke-width="${stroke}"/>
      ${centerLabel}
    </svg>`;
  }

  let cumulative = 0;
  let circles = '';
  sorted.forEach(seg => {
    const pct = seg.value / total;
    const dash = Math.max(0, pct * circumference - gapPx);
    const gap = circumference - dash;
    const offset = -cumulative * circumference;
    circles += `<circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="${seg.color}" stroke-width="${stroke}"
      stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${offset}"
      transform="rotate(-90 ${cx} ${cy})" stroke-linecap="round"/>`;
    cumulative += pct;
  });

  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${circles}${centerLabel}</svg>`;
}

const STOCK_PALETTE = ["#55694A","#A8462F","#5B7CA8","#B08B2E","#8A5A9E","#3E8E7E","#C0703A","#6B4C3A","#4A7C8C","#8C4A6B"];
function getSymbolColor(symbol){
  let hash = 0;
  for(let i=0;i<symbol.length;i++) hash = (hash * 31 + symbol.charCodeAt(i)) >>> 0;
  return STOCK_PALETTE[hash % STOCK_PALETTE.length];
}

function donutLegendHTML(segments, formatFn, limit){
  const total = segments.reduce((s,seg)=>s+seg.value,0);
  let sorted = segments.filter(s=>s.value>0).sort((a,b)=>b.value-a.value);
  if(limit) sorted = sorted.slice(0, limit);
  return sorted.map(seg => {
    const pct = total>0 ? ((seg.value/total)*100).toFixed(0) : 0;
    return `
      <div class="legend-row">
        <span class="legend-dot" style="background:${seg.color}"></span>
        <span class="legend-label">${escapeHtml(seg.label)}</span>
        <span class="legend-value"><strong>${pct}%</strong> · ${formatFn(seg.value)}</span>
      </div>`;
  }).join('');
}

// Builds a simple multi-series line chart. series: [{label, color, points:[y0,y1,...]}]
// labels: x-axis labels, one per point index.
function lineChartSVG(series, labels, opts){
  opts = opts || {};
  const width = opts.width || 600, height = opts.height || 260;
  const padL = 54, padR = 16, padT = 16, padB = 30;
  const plotW = width - padL - padR, plotH = height - padT - padB;

  let allValues = [];
  series.forEach(s => allValues = allValues.concat(s.points));
  const maxVal = Math.max(...allValues, 0);
  const minVal = Math.min(...allValues, 0);
  const range = (maxVal - minVal) || 1;
  const n = labels.length;

  const xFor = i => padL + (n<=1 ? 0 : (i/(n-1)) * plotW);
  const yFor = v => padT + plotH - ((v - minVal)/range) * plotH;

  let gridLines = '';
  const gridSteps = 4;
  for(let g=0; g<=gridSteps; g++){
    const val = minVal + (range * g/gridSteps);
    const y = yFor(val);
    gridLines += `<line x1="${padL}" y1="${y}" x2="${width-padR}" y2="${y}" stroke="var(--paper-line)" stroke-width="1"/>`;
    gridLines += `<text x="${padL-8}" y="${y+4}" font-size="10" fill="var(--ink-soft)" text-anchor="end">${opts.yFormat ? opts.yFormat(val) : Math.round(val)}</text>`;
  }

  let xLabels = '';
  const labelStep = Math.max(1, Math.ceil(n/6));
  labels.forEach((lab,i) => {
    if(i % labelStep !== 0 && i !== n-1) return;
    xLabels += `<text x="${xFor(i)}" y="${height-8}" font-size="10" fill="var(--ink-soft)" text-anchor="middle">${lab}</text>`;
  });

  let linesHtml = '';
  series.forEach((s,idx) => {
    const pts = s.points.map((v,i) => `${xFor(i)},${yFor(v)}`).join(' ');
    if(idx === 0){
      const areaPts = `${xFor(0)},${yFor(minVal)} ${pts} ${xFor(n-1)},${yFor(minVal)}`;
      linesHtml += `<polygon points="${areaPts}" fill="${s.color}" opacity="0.10"/>`;
    }
    linesHtml += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  });

  // Interactive hover points: a native tooltip on each point shows the series
  // name, the x-axis label, and the exact value.
  const fmtTip = opts.tooltipFormat || (v => Math.round(v));
  let pointsHtml = '';
  series.forEach(s => {
    s.points.forEach((v,i) => {
      pointsHtml += `<circle cx="${xFor(i)}" cy="${yFor(v)}" r="9" fill="transparent" stroke="none">
        <title>${s.label} — ${labels[i]}: ${fmtTip(v)}</title>
      </circle>
      <circle cx="${xFor(i)}" cy="${yFor(v)}" r="3" fill="${s.color}" style="pointer-events:none;"/>`;
    });
  });

  return `<svg viewBox="0 0 ${width} ${height}" width="100%" style="max-width:${width}px;">
    ${gridLines}${xLabels}${linesHtml}${pointsHtml}
  </svg>`;
}

          try{ await sb.from('profiles').insert({ id: data.user.id, username, avatar_type:'none' }); }catch(e){}
        }
      }else{
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if(error) throw error;
        currentUser = data.user;
        await loadUserData();
        view = "home";

      }
    }catch(err){
      errorEl.textContent = err.message || 'Something went wrong.';
    }finally{
      btn.disabled = false;
    }
  });
}

/* ================= Recurring generation ================= */
function generateRecurringEntries(){
  const nowKey = currentMonthKey();
  const newOnes = [];
  recurringTemplates.forEach(t => {
    const endKey = t.startMonth > nowKey ? t.startMonth : nowKey;
    const skipped = t.skippedMonths || [];
    let m = t.startMonth, guard = 0;
    while(m <= endKey && guard < 600){
      guard++;
      const exists = expenses.some(e => e.recurringId === t.id && e.date.slice(0,7) === m);
      if(!exists && !skipped.includes(m)){
        const day = Math.min(t.day, daysInMonth(m));
        const entry = { id: uid(), amount:t.amount, category:t.category, note:t.note, date:`${m}-${pad2(day)}`, recurringId:t.id };
        expenses.push(entry);
        newOnes.push(entry);
      }
      m = nextMonthKey(m);
    }
  });
  return newOnes;
}
async function insertGeneratedEntries(list){
  const rows = list.map(e => ({ user_id: currentUser.id, amount:e.amount, category:e.category, note:e.note, date:e.date, recurring_id:e.recurringId }));
  const { data } = await sb.from('expenses').insert(rows).select();
  if(data) data.forEach((row,i) => { list[i].id = row.id; });
}

function wireTxnSearch(){
  const input = document.getElementById('txnSearch');
  if(!input) return;
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    const container = document.getElementById('monthListContainer');
    const results = document.getElementById('searchResults');
    if(!q){
      if(container) container.style.display = '';
      results.innerHTML = '';
      return;
    }
    if(container) container.style.display = 'none';

    const expMatches = expenses.filter(e => e.category.toLowerCase().includes(q) || (e.note||'').toLowerCase().includes(q))
      .map(e => ({ ...e, kind:'expense' }));
    const incMatches = incomeEntries.filter(i => i.category.toLowerCase().includes(q) || (i.note||'').toLowerCase().includes(q))
      .map(i => ({ ...i, kind:'income' }));
    const all = expMatches.concat(incMatches).sort((a,b) => b.date.localeCompare(a.date));

    if(all.length === 0){
      results.innerHTML = `<div class="empty">No matches for "${escapeHtml(input.value)}".</div>`;
      return;
    }
    results.innerHTML = all.map(item => {
      const d = new Date(item.date + "T00:00:00");
      const dateLabel = d.toLocaleDateString(undefined,{month:'short', day:'numeric', year:'numeric'});
      const color = item.kind==='income' ? 'var(--moss)' : (CATEGORY_COLORS[item.category] || CATEGORY_COLORS.Other);
      const sign = item.kind==='income' ? '+' : '';
      return `
        <div class="entry-row" data-jump="${item.date.slice(0,7)}" style="cursor:pointer;">
          <div class="dot" style="background:${color}"></div>
          <div class="entry-info">
            <div class="entry-cat">${escapeHtml(item.category)}</div>
            <div class="entry-note">${dateLabel}${item.note ? ' · ' + escapeHtml(item.note) : ''}</div>
          </div>
          <div class="entry-amount" style="${item.kind==='income'?'color:var(--moss);':''}">${sign}${fmt(item.amount)}</div>
        </div>`;
    }).join('');
    results.querySelectorAll('[data-jump]').forEach(row => {
      row.addEventListener('click', () => { activeMonth = row.getAttribute('data-jump'); view="detail"; render(); });
    });
  });
}

function wireBudgetForm(){
  const form = document.getElementById('budgetForm');
  if(!form) return;
  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const inputs = document.querySelectorAll('.budget-input');
    for(const input of inputs){
      const cat = input.getAttribute('data-cat');
      const val = input.value.trim();
      if(val === ''){
        delete categoryBudgets[cat];
        await sb.from('category_budgets').delete().eq('user_id', currentUser.id).eq('category', cat);
      }else{
        const num = parseFloat(val);
        categoryBudgets[cat] = num;
        await sb.from('category_budgets').upsert({ user_id: currentUser.id, category: cat, monthly_limit: num });
      }
    }
    alert('Budgets saved.');
  });
}

          <div class="budget-top">
            <span>${escapeHtml(cat)}</span>
            <span>${fmt(spent)} / ${fmt(limit)}</span>
          </div>
          <div class="budget-track"><div class="budget-fill ${over?'over':'ok'}" style="width:${pct}%;"></div></div>
        </div>`;
    });
  }

  const monthIncome = incomeEntries.filter(i => i.date.slice(0,7) === monthKey);
  const incomeTotal = monthIncome.reduce((s,i)=>s+i.amount,0);
  const remaining = incomeTotal - total;

  let incomeHtml = '';
  if(monthIncome.length > 0){
    incomeHtml = `<div class="section-label">Income</div>`;
    monthIncome.forEach(i => {
      incomeHtml += `
        <div class="entry-row" data-income-id="${i.id}" style="cursor:pointer;">
          <div class="dot" style="background:var(--moss)"></div>
          <div class="entry-info">
            <div class="entry-cat">${escapeHtml(i.category)}</div>
            ${i.note ? `<div class="entry-note">${escapeHtml(i.note)}</div>` : ''}
          </div>
          <div class="entry-amount" style="color:var(--moss);">+${fmt(i.amount)}</div>
          <button class="entry-del" data-income-id="${i.id}" aria-label="Delete income">✕</button>
        </div>`;
    });
  }

  // Category breakdown + savings donut charts
  let chartsHtml = '';
  if(entries.length > 0){
    const catSegments = Object.keys(catTotals).map(cat => ({
      label: cat, value: catTotals[cat], color: CATEGORY_COLORS[cat] || CATEGORY_COLORS.Other
    })).sort((a,b) => b.value - a.value);

    const categoryDonut = `
      <div class="chart-block">
        <div class="chart-title">Where it's going</div>
        <div class="chart-block-inner">
          ${donutChartSVG(catSegments, {centerLabel:"Total", centerValue: fmt(catSegments.reduce((s,x)=>s+x.value,0))})}
          <div class="legend-list">${donutLegendHTML(catSegments, fmt)}</div>
        </div>
      </div>`;

    let savingsDonut = '';
    if(incomeTotal > 0){
      const spentClamped = Math.min(total, incomeTotal);
      const savedClamped = Math.max(0, incomeTotal - total);
      const overspent = Math.max(0, total - incomeTotal);
      const savingsSegments = overspent > 0
        ? [{ label:'Spent (income)', value:spentClamped, color:'var(--ink)' }, { label:'Over budget', value:overspent, color:'var(--rust)' }]
        : [{ label:'Spent', value:spentClamped, color:'var(--ink)' }, { label:'Saved', value:savedClamped, color:'var(--moss)' }];
      savingsDonut = `
        <div class="chart-block">
          <div class="chart-title">Spent vs. saved</div>
          <div class="chart-block-inner">
            ${donutChartSVG(savingsSegments, {centerLabel:"Income", centerValue: fmt(incomeTotal)})}
            <div class="legend-list">${donutLegendHTML(savingsSegments, fmt)}</div>
          </div>
        </div>`;
    }

    chartsHtml = `<div class="charts-row">${categoryDonut}${savingsDonut}</div>`;
  }

  // Month-over-month analytics
  let analyticsHtml = '';
  const analytics = computeAnalytics(monthKey);
  if(analytics.curTotal > 0 || analytics.prevTotal > 0){
    const totalDir = analytics.totalChangePct == null ? 'flat' : (analytics.totalChangePct > 0 ? 'up' : (analytics.totalChangePct < 0 ? 'down' : 'flat'));
    const totalPctText = analytics.totalChangePct == null ? 'No prior month to compare' : `${analytics.totalChangePct>0?'+':''}${analytics.totalChangePct.toFixed(1)}%`;
    let rows = `
      <div class="trend-row total">
        <span>Expenses</span>
        <span class="trend-pct ${totalDir}">${totalPctText}</span>
      </div>`;
    analytics.categoryChanges.slice(0,6).forEach(c => {
      const dir = c.pct == null ? 'flat' : (c.pct > 0 ? 'up' : (c.pct < 0 ? 'down' : 'flat'));
      const pctText = c.pct == null ? 'New' : `${c.pct>0?'+':''}${c.pct.toFixed(1)}%`;
      rows += `
        <div class="trend-row">
          <span>${escapeHtml(c.cat)}</span>
          <span class="trend-pct ${dir}">${pctText}</span>
        </div>`;
    });

    let insightsHtml = '';
    analytics.insights.forEach(ins => {
      insightsHtml += `<div class="insight-card">You spent ${fmt(ins.diff)} more on <strong>${escapeHtml(ins.cat)}</strong> than your 3-month average (${fmt(ins.avg3mo)}).</div>`;
    });

    analyticsHtml = `
      <div class="section-label">${t("monthVsLast")}</div>
      ${rows}
      ${insightsHtml}
    `;
  }

  document.getElementById('mainArea').innerHTML = `
    <div class="networth-summary">
      <div class="nw-card"><div class="label">${t('incomeIn')} ${monthLabel(monthKey)}</div><div class="value" style="color:var(--moss);">${fmt(incomeTotal)}</div></div>
      <div class="nw-card"><div class="label">${t('spentIn')} ${monthLabel(monthKey)}</div><div class="value">${fmt(total)}</div></div>
      <div class="nw-card highlight"><div class="label">${t('remaining')}</div><div class="value" style="${remaining<0?'color:var(--rust);':''}">${fmt(remaining)}</div></div>
    </div>
    ${chartsHtml}
    ${analyticsHtml}
    ${budgetHtml}
    ${incomeHtml}
    <div class="section-label">${t('entries')}</div>
    ${listHtml}
  `;

  document.getElementById('backBtn').addEventListener('click', () => { view="months"; render(); });

  document.querySelectorAll('.entry-row[data-income-id]').forEach(row => {
    row.addEventListener('click', (e) => {
      if(e.target.closest('.entry-del')) return;
      const id = row.getAttribute('data-income-id');
      const item = incomeEntries.find(i => i.id === id);
      if(!item) return;
      openEditModal('income', item);
    });
  });
  document.querySelectorAll('.entry-row[data-id]').forEach(row => {
    row.addEventListener('click', (e) => {
      if(e.target.closest('.entry-del')) return;
      const id = row.getAttribute('data-id');
      const item = expenses.find(x => x.id === id);
      if(!item) return;
      openEditModal('expense', item);
    });
  });

  document.querySelectorAll('[data-income-id].entry-del').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const id = btn.getAttribute('data-income-id');
      incomeEntries = incomeEntries.filter(i => i.id !== id);
      render();
      await sb.from('income_entries').delete().eq('id', id);
    });
  });
  document.querySelectorAll('.entry-del:not([data-income-id])').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const id = btn.getAttribute('data-id');
      const entry = expenses.find(e => e.id === id);
      if(entry && entry.recurringId){
        const t = recurringTemplates.find(rt => rt.id === entry.recurringId);
        if(t){
          t.skippedMonths = t.skippedMonths || [];
          const mKey = entry.date.slice(0,7);
          if(!t.skippedMonths.includes(mKey)) t.skippedMonths.push(mKey);
          await sb.from('recurring_templates').update({ skipped_months: t.skippedMonths }).eq('id', t.id);
        }
      }
      expenses = expenses.filter(e => e.id !== id);
      render();
      await sb.from('expenses').delete().eq('id', id);
    });
  });
}

function renderRecurring(){
  document.getElementById('pageTitle').innerHTML = `<button class="back-btn" id="backBtn" aria-label="Back"><svg width="9" height="14" viewBox="0 0 9 14" style="display:block;"><path d="M8 1L2 7L8 13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button> Bills`;
  document.getElementById('pageSub').innerHTML = '';

  const mainArea = document.getElementById('mainArea');
  if(recurringTemplates.length === 0){
    mainArea.innerHTML = `<div class="empty">${t('noRecurringYet')}</div>`;
    document.getElementById('backBtn').addEventListener('click', () => { view="months"; render(); });
    return;
  }

  const monthlyTotal = recurringTemplates.reduce((s,tpl) => s + tpl.amount, 0);

  function nextDueDate(tpl){
    const today = new Date(); today.setHours(0,0,0,0);
    let mk = currentMonthKey();
    let day = Math.min(tpl.day, daysInMonth(mk));
    let due = new Date(Number(mk.split('-')[0]), Number(mk.split('-')[1])-1, day);
    if(due < today){
      mk = nextMonthKey(mk);
      day = Math.min(tpl.day, daysInMonth(mk));
      due = new Date(Number(mk.split('-')[0]), Number(mk.split('-')[1])-1, day);
    }
    return due;
  }

  const dueSoon = recurringTemplates
    .map(tpl => ({ tpl, due: nextDueDate(tpl) }))
    .sort((a,b) => a.due - b.due)
    .slice(0,6);

  let dueSoonHtml = `<div class="section-label">Due soon</div>`;
  dueSoon.forEach(({tpl,due}) => {
    const dateLabel = due.toLocaleDateString(undefined,{month:'short', day:'numeric'});
    dueSoonHtml += `
      <div class="trend-row">
        <span>${escapeHtml(tpl.note || tpl.category)}</span>
        <span style="display:flex;gap:16px;align-items:center;">
          <span style="color:var(--ink-soft);font-size:12.5px;">${dateLabel}</span>
          <span style="font-family:ui-monospace, SF Mono, Menlo, monospace;font-weight:600;">${fmt(tpl.amount)}</span>
        </span>
      </div>`;
  });

  const byCategory = {};
  recurringTemplates.forEach(tpl => {
    const cat = tpl.category || 'Other';
    (byCategory[cat] = byCategory[cat] || []).push(tpl);
  });
  const orderedCats = CATEGORY_ORDER.filter(c => byCategory[c]).concat(
    Object.keys(byCategory).filter(c => !CATEGORY_ORDER.includes(c))
  );

  let html = `
    ${dueSoonHtml}
    <div class="total-block" style="margin-top:28px;">
      <div class="total-label">Monthly committed bills</div>
      <div class="total-amount">${fmt(monthlyTotal)}</div>
    </div>
    <p class="hero-body" style="font-size:12.5px;margin:-10px 0 4px;">Tap any bill below to log this month's payment right now. Use ✎ to change the amount instead.</p>
  `;

  orderedCats.forEach(cat => {
    const items = byCategory[cat];
    const catTotal = items.reduce((s,tpl) => s + tpl.amount, 0);
    const color = CATEGORY_COLORS[cat] || CATEGORY_COLORS.Other;
    html += `
      <div class="section-label" style="display:flex; align-items:center; justify-content:space-between;">
        <span><span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${color};margin-inline-end:8px;"></span>${escapeHtml(cat)}</span>
        <span>${fmt(catTotal)}/mo</span>
      </div>`;
    items.forEach(tpl => {
      html += `
        <div class="recur-card" data-id="${tpl.id}" style="cursor:pointer;">
          <div>
            <div class="recur-name">${escapeHtml(tpl.note || tpl.category)}</div>
            <div class="recur-meta">day ${tpl.day} of every month · since ${monthLabel(tpl.startMonth)}</div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;">
            <div class="recur-amount">${fmt(tpl.amount)}</div>
            <button class="stop-btn edit-amount-btn" data-id="${tpl.id}" aria-label="Edit amount" title="Edit amount">✎</button>
            <button class="stop-btn" data-id="${tpl.id}">${t('stop')}</button>
          </div>
        </div>`;
    });
  });

  mainArea.innerHTML = html;

  mainArea.querySelectorAll('.recur-card').forEach(row => {
    row.addEventListener('click', async (e) => {
      if(e.target.closest('button')) return;
      const id = row.getAttribute('data-id');
      const tpl = recurringTemplates.find(t => t.id === id);
      if(!tpl) return;
      const today = new Date();
      const monthVal = `${today.getFullYear()}-${pad2(today.getMonth()+1)}`;
      const date = `${monthVal}-${pad2(today.getDate())}`;
      const btnAmount = row.querySelector('.recur-amount');
      const originalText = btnAmount.textContent;
      try{
        const { data, error } = await sb.from('expenses').insert({
          user_id: currentUser.id, amount: tpl.amount, category: tpl.category, note: tpl.note ? `${tpl.note} (payment)` : 'Payment', date
        }).select().single();
        if(error) throw error;
        expenses.push({ id:data.id, amount:tpl.amount, category:tpl.category, note: tpl.note ? `${tpl.note} (payment)` : 'Payment', date });
        btnAmount.textContent = 'Paid ✓';
        setTimeout(() => { btnAmount.textContent = originalText; }, 1500);
      }catch(err){
        alert(err.message || 'Could not log that payment.');
      }
    });
  });
  mainArea.querySelectorAll('.edit-amount-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const id = btn.getAttribute('data-id');
      const tpl = recurringTemplates.find(t => t.id === id);
      if(!tpl) return;
      const input = prompt(`Update monthly amount for "${tpl.note || tpl.category}"\nCurrent: ${fmt(tpl.amount)}\n\nEnter the new amount:`);
      if(input === null) return;
      const val = parseFloat(input);
      if(isNaN(val) || val <= 0) return;
      tpl.amount = val;
      renderRecurring();
      await sb.from('recurring_templates').update({ amount: val }).eq('id', id);
    });
  });

  mainArea.querySelectorAll('.stop-btn:not(.edit-amount-btn)').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const id = btn.getAttribute('data-id');
      recurringTemplates = recurringTemplates.filter(rt => rt.id !== id);
      await sb.from('recurring_templates').delete().eq('id', id);
      render();
    });
  });
  document.getElementById('backBtn').addEventListener('click', () => { view="months"; render(); });
}

const NET_WORTH_COLORS = {
  "Cash":"#55694A", "Chequing/Savings":"#5B7CA8", "Investments":"#B08B2E", "TFSA/RRSP":"#8A5A9E",
  "Credit Cards":"#A8462F", "Loans/Debt":"#6B4C3A"
};

function renderNetWorth(){
  document.getElementById('pageTitle').innerHTML = `<button class="back-btn" id="backBtn" aria-label="Back"><svg width="9" height="14" viewBox="0 0 9 14" style="display:block;"><path d="M8 1L2 7L8 13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button> ${t('netWorth')}`;
  document.getElementById('pageSub').innerHTML = '';

  // Net worth now pulls from three sources so nothing has to be entered twice:
  // 1) Accounts you've added, 2) your Portfolio's live market value,
  // 3) manual items for things that aren't accounts (a car, property, etc.)
  const accountAssets = accounts.filter(a => !ACCOUNT_LIABILITY_TYPES.includes(a.type)).reduce((s,a)=>s+a.balance,0);
  const accountDebts  = accounts.filter(a =>  ACCOUNT_LIABILITY_TYPES.includes(a.type)).reduce((s,a)=>s+a.balance,0);

  let portfolioValue = 0;
  portfolio.forEach(p => {
    const q = quoteCache[p.symbol];
    if(q && q !== 'error') portfolioValue += (q.price * p.shares) * exchangeRate;
  });

  const manualAssets = netWorthItems.filter(i => ASSET_CATS.includes(i.category)).reduce((s,i)=>s+i.balance,0);
  const manualDebts  = netWorthItems.filter(i => LIABILITY_CATS.includes(i.category)).reduce((s,i)=>s+i.balance,0);

  const totalAssets = accountAssets + portfolioValue + manualAssets;
  const totalLiabilities = accountDebts + manualDebts;
  const netWorth = totalAssets - totalLiabilities;

  let chartsHtml = '';
  if(totalAssets > 0 || totalLiabilities > 0){
    let blocks = '';
    if(totalAssets > 0){
      const assetSegments = [];
      ACCOUNT_TYPES.filter(t => !ACCOUNT_LIABILITY_TYPES.includes(t)).forEach(type => {
        const v = accounts.filter(a=>a.type===type).reduce((s,a)=>s+a.balance,0);
        if(v > 0) assetSegments.push({ label:type, value:v, color: NET_WORTH_COLORS[type] || getSymbolColor(type) });
      });
      if(portfolioValue > 0) assetSegments.push({ label:'Investments (portfolio)', value:portfolioValue, color:NET_WORTH_COLORS['Investments'] });
      ASSET_CATS.forEach(cat => {
        const v = netWorthItems.filter(i=>i.category===cat).reduce((s,i)=>s+i.balance,0);
        if(v > 0) assetSegments.push({ label:cat+' (manual)', value:v, color: NET_WORTH_COLORS[cat] || getSymbolColor(cat) });
      });
      blocks += `
        <div class="chart-block">
          <div class="chart-title">Assets breakdown</div>
          <div class="chart-block-inner">
            ${donutChartSVG(assetSegments, {centerLabel:"Assets", centerValue: fmt(totalAssets)})}
            <div class="legend-list">${donutLegendHTML(assetSegments, fmt)}</div>
          </div>
        </div>`;
    }
    if(totalLiabilities > 0){
      const liabSegments = [];
      ACCOUNT_LIABILITY_TYPES.forEach(type => {
        const v = accounts.filter(a=>a.type===type).reduce((s,a)=>s+a.balance,0);
        if(v > 0) liabSegments.push({ label:type, value:v, color: NET_WORTH_COLORS[type] || getSymbolColor(type) });
      });
      LIABILITY_CATS.forEach(cat => {
        const v = netWorthItems.filter(i=>i.category===cat).reduce((s,i)=>s+i.balance,0);
        if(v > 0) liabSegments.push({ label:cat+' (manual)', value:v, color: NET_WORTH_COLORS[cat] || getSymbolColor(cat) });
      });
      blocks += `
        <div class="chart-block">
          <div class="chart-title">Liabilities breakdown</div>
          <div class="chart-block-inner">
            ${donutChartSVG(liabSegments, {centerLabel:"Debts", centerValue: fmt(totalLiabilities)})}
            <div class="legend-list">${donutLegendHTML(liabSegments, fmt)}</div>
          </div>
        </div>`;
    }
    chartsHtml = `<div class="charts-row">${blocks}</div>`;
  }

  const sourceNote = `
    <div class="insight-card" style="border-left-color:var(--moss);">
      Pulling from <strong>${accounts.length}</strong> account${accounts.length===1?'':'s'}${portfolioValue>0?` and your portfolio (${fmt(portfolioValue)})`:''}${netWorthItems.length>0?` plus ${netWorthItems.length} manual item${netWorthItems.length===1?'':'s'}`:''}.
      Update account balances on the Accounts page — no need to re-enter them here.
    </div>`;

  let html = `
    <div class="networth-summary">
      <div class="nw-card"><div class="label">${t('totalAssets')}</div><div class="value">${fmt(totalAssets)}</div></div>
      <div class="nw-card"><div class="label">${t('totalLiabilities')}</div><div class="value">${fmt(totalLiabilities)}</div></div>
      <div class="nw-card highlight"><div class="label">${t('netWorthLabel')}</div><div class="value">${fmt(netWorth)}</div></div>
    </div>
    ${chartsHtml}
    ${sourceNote}
    <div class="section-label">Other assets &amp; debts</div>
    <p class="hero-body" style="font-size:12.5px;margin:-6px 0 14px;">For things that aren't accounts — a car, property, or anything else you want counted. Tap any to update it.</p>

    <div class="add-symbol-row" style="flex-direction:column;gap:10px;align-items:stretch;">
      <select id="nwCategory">
        <optgroup label="Assets">
          ${ASSET_CATS.map(c=>`<option value="${c}">${c}</option>`).join('')}
        </optgroup>
        <optgroup label="Liabilities">
          ${LIABILITY_CATS.map(c=>`<option value="${c}">${c}</option>`).join('')}
        </optgroup>
      </select>
      <div class="row">
        <div class="field"><input type="text" id="nwLabel" placeholder="e.g. 2019 Honda Civic"></div>
        <div class="field"><input type="number" id="nwBalance" placeholder="Value" step="0.01" min="0"></div>
      </div>
      <button type="button" class="add" id="addNwBtn">${t('addItem')}</button>
    </div>
  `;

  const allCats = ASSET_CATS.concat(LIABILITY_CATS);
  allCats.forEach(cat => {
    const items = netWorthItems.filter(i => i.category === cat);
    if(items.length === 0) return;
    const subtotal = items.reduce((s,i)=>s+i.balance,0);
    html += `
      <div class="section-label" style="display:flex;justify-content:space-between;">
        <span>${cat}</span><span>${fmt(subtotal)}</span>
      </div>`;
    items.forEach(item => {
      html += `
        <div class="nw-item-row" data-id="${item.id}" data-cat="${escapeHtml(cat)}" style="cursor:pointer;">
          <div class="nw-item-label">${escapeHtml(item.label)}</div>
          <div style="display:flex;align-items:center;gap:10px;">
            <div class="nw-item-balance">${fmt(item.balance)}</div>
            <button class="stock-del" data-id="${item.id}" aria-label="Remove">✕</button>
          </div>
        </div>`;
    });
  });

  if(netWorthItems.length === 0){
    html += '<div class="empty">Add your accounts above — cash, chequing, investments, cards, loans — to see your full net worth.</div>';
  }

  document.getElementById('mainArea').innerHTML = html;
  document.getElementById('backBtn').addEventListener('click', () => { view="months"; render(); });
  document.getElementById('addNwBtn').addEventListener('click', addNetWorthItem);

  document.querySelectorAll('.nw-item-row').forEach(row => {
    row.addEventListener('click', async (e) => {
      if(e.target.closest('.stock-del')) return;
      const id = row.getAttribute('data-id');
      const cat = row.getAttribute('data-cat');
      const item = netWorthItems.find(i => i.id === id);
      if(!item) return;

      let newBalance;
      if(LIABILITY_CATS.includes(cat)){
        const input = prompt(`Make a payment toward "${item.label}"\nCurrent balance: ${fmt(item.balance)}\n\nHow much are you paying?`);
        if(input === null) return;
        const payment = parseFloat(input);
        if(isNaN(payment) || payment <= 0) return;
        newBalance = Math.max(0, item.balance - payment);
      }else{
        const input = prompt(`Update balance for "${item.label}"\nCurrent balance: ${fmt(item.balance)}\n\nEnter the new balance:`);
        if(input === null) return;
        const val = parseFloat(input);
        if(isNaN(val) || val < 0) return;
        newBalance = val;
      }

      item.balance = newBalance;
      renderNetWorth();
      await sb.from('net_worth_items').update({ balance: newBalance }).eq('id', id);
    });
  });

  document.querySelectorAll('.nw-item-row .stock-del').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const id = btn.getAttribute('data-id');
      netWorthItems = netWorthItems.filter(i => i.id !== id);
      render();
      await sb.from('net_worth_items').delete().eq('id', id);
    });
  });
}

async function addNetWorthItem(){
  const category = document.getElementById('nwCategory').value;
  const label = document.getElementById('nwLabel').value.trim();
  const balance = parseFloat(document.getElementById('nwBalance').value);
  if(!label || isNaN(balance) || balance < 0) return;

  const { data, error } = await sb.from('net_worth_items').insert({
    user_id: currentUser.id, category, label, balance
  }).select().single();
  if(error){ alert(error.message || 'Could not add that item.'); return; }

  netWorthItems.push({ id:data.id, category, label, balance });
  renderNetWorth();
}

/* ================= Accounts ================= */
const ACCOUNT_ICONS = {
  "Chequing":"🏦", "Savings":"🏦", "Cash":"💵", "Credit Card":"💳",
  "Investment":"📈", "Loan":"📄", "Mortgage":"🏠"
};

function renderAccounts(){

async function addAccount(){
  const name = document.getElementById('acctName').value.trim();
  const type = document.getElementById('acctType').value;
  const institution = document.getElementById('acctInstitution').value.trim();
  const balance = parseFloat(document.getElementById('acctBalance').value) || 0;
  if(!name) return;

  const { data, error } = await sb.from('accounts').insert({
    user_id: currentUser.id, name, type, currency: userSettings.currency, balance, institution: institution || null
  }).select().single();
  if(error){ alert(error.message || 'Could not add that account.'); return; }

  accounts.push({ id:data.id, name, type, currency:userSettings.currency, balance, institution });
  renderAccounts();
}

async function doTransfer(){
  const fromId = document.getElementById('transferFrom').value;
  const toId = document.getElementById('transferTo').value;
  const amount = parseFloat(document.getElementById('transferAmount').value);
  const note = document.getElementById('transferNote').value.trim();

  if(!amount || amount <= 0) return;
  if(fromId === toId){ alert('Pick two different accounts to transfer between.'); return; }

  const fromAcct = accounts.find(a => a.id === fromId);
  const toAcct = accounts.find(a => a.id === toId);
  if(!fromAcct || !toAcct) return;

  const date = `${currentMonthKey()}-${pad2(currentDay())}`;
  const newFromBalance = fromAcct.balance - amount;
  const newToBalance = toAcct.balance + amount;

  try{
    const { data, error } = await sb.from('transfers').insert({
      user_id: currentUser.id, from_account_id: fromId, to_account_id: toId, amount, note: note||null, date
    }).select().single();
    if(error) throw error;

    await sb.from('accounts').update({ balance:newFromBalance }).eq('id', fromId);
    await sb.from('accounts').update({ balance:newToBalance }).eq('id', toId);

    fromAcct.balance = newFromBalance;
    toAcct.balance = newToBalance;
    transfers.unshift({ id:data.id, fromAccountId:fromId, toAccountId:toId, amount, note, date });
    renderAccounts();
  }catch(err){
    alert(err.message || 'Could not complete that transfer.');
  }
}

/* ================= Growth Calculator ================= */
function computeGrowth(principal, monthlyContribution, annualRatePct, years, inflationPct){
  const monthlyRate = (annualRatePct/100) / 12;
  const months = years * 12;
  let balance = principal;
  const nominalByYear = [Math.round(principal)];
  const contributedByYear = [Math.round(principal)];
  for(let m=1; m<=months; m++){
    balance = balance * (1 + monthlyRate) + monthlyContribution;
    if(m % 12 === 0){
      nominalByYear.push(Math.round(balance));
      contributedByYear.push(Math.round(principal + monthlyContribution * m));
    }
  }
  const realByYear = nominalByYear.map((val,i) => Math.round(val / Math.pow(1 + inflationPct/100, i)));
  const totalContributed = principal + monthlyContribution * months;
  return { nominalByYear, realByYear, contributedByYear, totalContributed, finalNominal: nominalByYear[nominalByYear.length-1], finalReal: realByYear[realByYear.length-1] };
}

function csvEscape(val){
  const s = String(val == null ? '' : val);
  if(s.includes(',') || s.includes('"') || s.includes('\n')){
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

function exportDataAsCSV(){
  const lines = [];

  lines.push('EXPENSES');
  lines.push(['Date','Category','Amount','Note','Recurring'].join(','));
  expenses.forEach(e => {
    lines.push([e.date, csvEscape(e.category), e.amount, csvEscape(e.note), e.recurringId ? 'Yes' : 'No'].join(','));
  });
  lines.push('');

  lines.push('INCOME');
  lines.push(['Date','Category','Amount','Note'].join(','));
  incomeEntries.forEach(i => {
    lines.push([i.date, csvEscape(i.category), i.amount, csvEscape(i.note)].join(','));
  });
  lines.push('');

  lines.push('ACCOUNTS');
  lines.push(['Name','Type','Institution','Balance'].join(','));
  accounts.forEach(a => {
    lines.push([csvEscape(a.name), csvEscape(a.type), csvEscape(a.institution), a.balance].join(','));
  });
  lines.push('');

  lines.push('TRANSFERS');
  lines.push(['Date','From','To','Amount','Note'].join(','));
  transfers.forEach(tr => {
    const from = accounts.find(a=>a.id===tr.fromAccountId);
    const to = accounts.find(a=>a.id===tr.toAccountId);
    lines.push([tr.date, csvEscape(from?from.name:''), csvEscape(to?to.name:''), tr.amount, csvEscape(tr.note)].join(','));
  });

  const csvContent = lines.join('\n');
  const blob = new Blob([csvContent], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `moneta-compass-export-${currentMonthKey()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function uploadAvatarFile(file){
  if(!file.type.startsWith('image/')){ alert('Please choose an image file.'); return; }
  try{
    const dataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const size = 300;
          const canvas = document.createElement('canvas');
          canvas.width = size; canvas.height = size;
          const ctx = canvas.getContext('2d');
          const scale = Math.max(size/img.width, size/img.height);
          const w = img.width*scale, h = img.height*scale;
          ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

    const res = await fetch(dataUrl);
    const blob = await res.blob();
    const path = `${currentUser.id}/avatar.jpg`;

    const { error: upErr } = await sb.storage.from('avatars').upload(path, blob, { contentType:'image/jpeg', upsert:true });
    if(upErr) throw upErr;

    await sb.from('profiles').update({ avatar_type:'upload', avatar_path:path, avatar_config:null }).eq('id', currentUser.id);
    const { data: signed } = await sb.storage.from('avatars').createSignedUrl(path, 3600);

    userProfile.avatarType = 'upload'; userProfile.avatarPath = path; userProfile.avatarConfig = null;
    userProfile.avatarUrl = signed ? signed.signedUrl : null;
    renderSettings();
  }catch(err){
    alert(err.message || 'Could not upload that photo.');
  }
}

function openWatchlist(){
  view = "watchlist";
  render();
  fetchMissingQuotes();
}

async function addSymbol(){
  const input = document.getElementById('symbolInput');
  const symbol = input.value.trim().toUpperCase();
  if(!symbol) return;
  if(watchlist.some(w => w.symbol === symbol)){ input.value=''; return; }

  const { data, error } = await sb.from('watchlist_items').insert({ user_id: currentUser.id, symbol }).select().single();
  if(error){ alert(error.message || 'Could not add that symbol.'); return; }
  watchlist.push({ id:data.id, symbol });
  renderWatchlist();
  await fetchQuote(symbol);
  if(view === "watchlist") renderWatchlist();
}

async function fetchQuote(symbol){
  try{
    const { data, error } = await sb.functions.invoke('finnhub-quote', { body: { endpoint:'quote', symbol } });
    if(error) throw error;
    if(!data || (data.c === 0 && data.d === null)){ quoteCache[symbol] = 'error'; return; }
    quoteCache[symbol] = { price:data.c, change:data.d, changePct:data.dp, high:data.h, low:data.l, open:data.o, prevClose:data.pc };
  }catch(e){
    quoteCache[symbol] = 'error';
  }
}

async function fetchMissingQuotes(){
  const missing = watchlist.filter(w => !quoteCache[w.symbol]);
  if(missing.length === 0) return;
  await Promise.all(missing.map(w => fetchQuote(w.symbol)));
  if(view === "watchlist") renderWatchlist();
}

async function refreshAllQuotes(){
  if(watchlist.length === 0) return;
  quoteCache = {};
  renderWatchlist();
  await Promise.all(watchlist.map(w => fetchQuote(w.symbol)));
  if(view === "watchlist") renderWatchlist();
}

async function addHolding(){
  const symbol = document.getElementById('holdingSymbol').value.trim().toUpperCase();
  const shares = parseFloat(document.getElementById('holdingShares').value);
  const costBasis = parseFloat(document.getElementById('holdingCost').value);
  if(!symbol || !shares || shares <= 0 || !costBasis || costBasis <= 0) return;

  const { data, error } = await sb.from('portfolio_holdings').insert({
    user_id: currentUser.id, symbol, shares, cost_basis: costBasis
  }).select().single();
  if(error){ alert(error.message || 'Could not add that holding.'); return; }

  portfolio.push({ id:data.id, symbol, shares, costBasis });
  renderPortfolio();
  await fetchQuote(symbol);
  if(view === "portfolio") renderPortfolio();
}

async function fetchStockDetails(symbol){
  const result = { marketCap:null, weekHigh52:null, weekLow52:null, nextEarnings:null, lastEarnings:null, ytdReturn:null };
  try{
    const { data, error } = await sb.functions.invoke('finnhub-quote', { body: { endpoint:'metric', symbol } });
    if(error) throw error;
    if(data && data.metric){
      result.marketCap = data.metric.marketCapitalization || null;
      result.weekHigh52 = data.metric['52WeekHigh'] || null;
      result.weekLow52 = data.metric['52WeekLow'] || null;
      result.ytdReturn = data.metric['yearToDatePriceReturnDaily'] != null ? data.metric['yearToDatePriceReturnDaily'] : null;
    }
  }catch(e){}

  try{
    const today = new Date();
    const future = new Date(); future.setDate(future.getDate() + 90);
    const fmt2 = d => d.toISOString().slice(0,10);
    const { data, error } = await sb.functions.invoke('finnhub-quote', { body: { endpoint:'calendar', symbol, from:fmt2(today), to:fmt2(future) } });
    if(error) throw error;
    if(data && data.earningsCalendar && data.earningsCalendar.length){
      result.nextEarnings = data.earningsCalendar[0];
    }
  }catch(e){}

  try{
    const { data, error } = await sb.functions.invoke('finnhub-quote', { body: { endpoint:'earnings', symbol } });
    if(error) throw error;
    if(data && data.length){
      result.lastEarnings = data[0];
    }
  }catch(e){}

  detailsCache[symbol] = result;
}

    const clamped = Math.max(0, Math.min(100, wPct));
    rangesHtml += `

        <div class="range-labels"><span>${fmtStock(d.weekLow52)}</span><span>${fmtStock(d.weekHigh52)}</span></div>

  }

  let metricsHtml = '<div class="metric-grid">' + rangesHtml;
  if(d && d.marketCap != null){
    const convertedCap = d.marketCap * exchangeRate;
    metricsHtml += `
      <div class="metric-box">

      </div>`;

    metricsHtml += `
      <div class="metric-box">
        <div class="metric-label">Open</div>
        <div class="metric-value">${fmtStock(q.open)}</div>
      </div>`;
  }
  if(d && d.ytdReturn != null){
    const ytdDir = d.ytdReturn > 0 ? 'up' : (d.ytdReturn < 0 ? 'down' : '');
    const ytdSign = d.ytdReturn > 0 ? '+' : '';
    metricsHtml += `
      <div class="metric-box">
        <div class="metric-label">YTD</div>
        <div class="metric-value holding-gain ${ytdDir}" style="font-size:16px;">${ytdSign}${d.ytdReturn.toFixed(2)}%</div>
      </div>`;
  }
  metricsHtml += '</div>';

  let earningsHtml = '<div class="section-label">Earnings</div>';
  if(d && d.nextEarnings){
    earningsHtml += `
      <div class="earnings-row">
        <div class="earnings-label">Next earnings date</div>
        <div class="earnings-value">${escapeHtml(d.nextEarnings.date || '—')}${d.nextEarnings.epsEstimate ? ` · est. EPS ${d.nextEarnings.epsEstimate}` : ''}</div>
      </div>`;
  }else{
    earningsHtml += `<div class="earnings-row"><div class="earnings-value">No upcoming earnings date found.</div></div>`;
  }
  if(d && d.lastEarnings){
    const actual = d.lastEarnings.actual, estimate = d.lastEarnings.estimate;
    let resultLabel = '';
    if(actual != null && estimate != null){
      resultLabel = actual >= estimate
        ? `<span class="beat">Beat estimate</span>`
        : `<span class="miss">Missed estimate</span>`;
    }
    earningsHtml += `
      <div class="earnings-row">
        <div class="earnings-label">Last quarter (${escapeHtml(d.lastEarnings.period || '')})</div>
        <div class="earnings-value">Actual EPS ${actual != null ? actual : '—'} vs. estimate ${estimate != null ? estimate : '—'} ${resultLabel}</div>
      </div>`;
  }else{
    earningsHtml += `<div class="earnings-row"><div class="earnings-value">No recent earnings data found.</div></div>`;
  }

  document.getElementById('mainArea').innerHTML = `
    <div class="detail-price-block">${priceHtml}</div>
    ${metricsHtml}
    ${earningsHtml}
    <p class="hero-body" style="font-size:12px;margin-top:18px;">Data from Finnhub. This is factual market data only — not a recommendation to buy, hold, or sell.</p>
  `;

  document.getElementById('backBtn').addEventListener('click', () => { view=detailReturnView; render(); });

  if(!q || q === 'error') fetchQuote(symbol).then(() => { if(view === "portfolioDetail") renderStockDetail(symbol); });
  if(!d) fetchStockDetails(symbol).then(() => { if(view === "portfolioDetail") renderStockDetail(symbol); });
}
