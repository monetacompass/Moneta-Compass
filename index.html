// Reads receipt text via free, on-device OCR (Tesseract.js) — no API key,
// no server, and no per-scan cost, since nothing leaves the browser.
function parseReceiptText(text){
  const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);

  let total = null;
  const totalPatterns = [
    /(?:grand\s*total|total\s*due|amount\s*due|balance\s*due|total)[^0-9$€£﷼]*([$€£﷼]?\s*\d+[\d,]*\.\d{2})/i,
    /([$€£﷼]?\s*\d+[\d,]*\.\d{2})\s*$/i
  ];
  for(const line of lines){
    for(const re of totalPatterns){
      const m=line.match(re);
      if(m){
        const n=Number(m[1].replace(/[^0-9.]/g,'').replace(/,(?=\d{3}\b)/g,''));
        if(Number.isFinite(n) && n>0){ total=n; break; }
      }
    }
    if(total !== null) break;
  }

  let date = null;
  const dateRegexes = [
    /\b(20\d{2})[-\/](\d{1,2})[-\/](\d{1,2})\b/,
    /\b(\d{1,2})[-\/](\d{1,2})[-\/](20\d{2})\b/,
    /\b(\d{1,2})\s+([A-Za-z]{3,9})\s+(20\d{2})\b/i
  ];
  const months={jan:1,january:1,feb:2,february:2,mar:3,march:3,apr:4,april:4,may:5,jun:6,june:6,jul:7,july:7,aug:8,august:8,sep:9,sept:9,september:9,oct:10,october:10,nov:11,november:11,dec:12,december:12};
  for(const line of lines){
    let m=line.match(dateRegexes[0]);
    if(m){ date=`${m[1]}-${pad2(m[2])}-${pad2(m[3])}`; break; }
    m=line.match(dateRegexes[1]);
    if(m){
      const a=Number(m[1]), b=Number(m[2]), y=m[3];
      const mm = a>12 ? b : b>12 ? a : a;
      const dd = a>12 ? a : b>12 ? b : b;
      date=`${y}-${pad2(mm)}-${pad2(dd)}`; break;
    }
    m=line.match(dateRegexes[2]);
    if(m){ const mm=months[m[2].toLowerCase()]; if(mm) { date=`${m[3]}-${pad2(mm)}-${pad2(m[1])}`; break; } }
  }

  const merchantExclusions=/^(receipt|invoice|store|date|time|cashier|subtotal|total|tax|visa|mastercard|amex|debit|credit|thank|welcome|www\.|http)/i;
  let merchant='';
  for(const line of lines.slice(0,10)){
    if(line.length>=2 && !merchantExclusions.test(line) && !/^[$€£﷼]?\s*\d[\d,]*[.]?\d*$/.test(line)) {
      merchant=line.replace(/[^\w&.'’()\- ]/g,' ').replace(/\s+/g,' ').trim();
      if(merchant.length>=2) break;
    }
  }

  const all=lines.join(' ').toLowerCase();
  let category='Other';
  if(/rent|mortgage|landlord|property management/.test(all)) category='Rent/Mortgage';
  else if(/walmart|costco|loblaw|no frills|sobeys|metro|grocery|grocer|whole foods|food basics/.test(all)) category='Food';
  else if(/uber|lyft|shell|esso|petro|gas station|parking|transit|ttc/.test(all)) category='Transport';
  else if(/pharmacy|rexall|shoppers drug mart|clinic|dental|health/.test(all)) category='Health';
  else if(/netflix|spotify|cinema|movie|restaurant|starbucks|mcdonald|tim hortons/.test(all)) category='Fun';
  else if(/home depot|ikea|wayfair|furniture/.test(all)) category='Housing';
  else if(/hydro|enbridge|bell|rogers|telus|internet|utility/.test(all)) category='Utilities';
  else if(/amazon|best buy|winners|mall|shopping/.test(all)) category='Shopping';

  return {merchant,total,date,category};
}

async function scanReceipt(file){
  if(!file) return;
  if(!window.Tesseract){ setReceiptStatus('Receipt scanner is still loading. Please try again.'); return; }
  if(!file.type.startsWith('image/')){ setReceiptStatus('Please choose an image file.'); return; }
  scanReceiptBtn.disabled = true;
  addSubmitBtn.disabled = true;
  setReceiptStatus('Reading receipt… this can take a little while on the first scan.');
  receiptPreview.src = URL.createObjectURL(file);
  receiptPreview.classList.add('show');
  try{
    if(!receiptWorker){
      receiptWorker = await Tesseract.createWorker('eng');
    }
    const { data } = await receiptWorker.recognize(file);
    const parsed = parseReceiptText(data.text || '');

    if(parsed.total !== null) document.getElementById('amount').value = parsed.total.toFixed(2);
    if(parsed.date){
      const parts=parsed.date.split('-');
      document.getElementById('monthPicker').value=`${parts[0]}-${parts[1]}`;
      document.getElementById('dayPicker').value=Number(parts[2]);
    }
    refreshCategoryOptions(document.getElementById('category'), parsed.category);
    if(parsed.merchant){ document.getElementById('note').value = parsed.merchant; }

    const found=[];
    if(parsed.merchant) found.push(`merchant: ${parsed.merchant}`);
    if(parsed.total !== null) found.push(`total: ${fmt(parsed.total)}`);
    if(parsed.date) found.push(`date: ${parsed.date}`);
    setReceiptStatus(found.length ? `Found ${found.join(' • ')}. Please review before saving.` : 'Could not confidently find the total/date. Please review the fields manually.');
  }catch(err){
    console.error(err);
    setReceiptStatus('Could not read this receipt. Try a clearer, well-lit photo.');
  }finally{
    scanReceiptBtn.disabled = false;
    addSubmitBtn.disabled = false;
  }
}

function refreshCategoryOptions(selectEl, currentValue){
  const allCats = CATEGORY_ORDER.concat(customCategories.filter(c => !CATEGORY_ORDER.includes(c)));
  let html = allCats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  html += `<option value="__new__">+ Add new category…</option>`;
  selectEl.innerHTML = html;
  if(currentValue && allCats.includes(currentValue)) selectEl.value = currentValue;
}

function ensureCategoryColor(cat){
  if(!CATEGORY_COLORS[cat]){
    const palette = ["#7A6F8A","#4A7C8C","#8C6B4A","#6B8C4A","#8C4A6B"];
    CATEGORY_COLORS[cat] = palette[Object.keys(CATEGORY_COLORS).length % palette.length];
  }
}

document.getElementById('category').addEventListener('change', async (e) => {
  if(e.target.value === '__new__'){
    const name = prompt('New category name:');
    if(name && name.trim()){
      const trimmed = name.trim();
      if(!customCategories.includes(trimmed) && !CATEGORY_ORDER.includes(trimmed)){
        const { data, error } = await sb.from('custom_categories').insert({ user_id: currentUser.id, name: trimmed }).select().single();
        if(!error){ customCategories.push(trimmed); ensureCategoryColor(trimmed); }
      }
      refreshCategoryOptions(e.target, trimmed);
    }else{
      refreshCategoryOptions(e.target, 'Other');
    }
  }
});

let entryType = 'expense'; // 'expense' | 'income'
let editingEntry = null; // { type:'expense'|'income', id } or null when adding new

function setEntryType(newType){
  entryType = newType;
  document.getElementById('tabExpense').textContent = t('expenseTab');
  document.getElementById('tabIncome').textContent = t('incomeTab');
  document.getElementById('tabExpense').classList.toggle('active', newType==='expense');
  document.getElementById('tabIncome').classList.toggle('active', newType==='income');
  document.getElementById('modalTitle').textContent = editingEntry
    ? (newType==='expense' ? 'Edit expense' : 'Edit income')
    : (newType==='expense' ? t('addExpense') : t('addIncome'));
  document.getElementById('addSubmitBtn').textContent = editingEntry ? 'Save changes' : (newType==='expense' ? t('addExpense') : t('addIncome'));
  document.getElementById('receiptSection').style.display = (newType==='expense' && !editingEntry) ? 'block' : 'none';
  document.getElementById('recurringSection').style.display = (newType==='expense' && !editingEntry) ? 'flex' : 'none';
  const tabsEl = document.getElementById('tabExpense').parentElement;
  if(tabsEl) tabsEl.style.display = editingEntry ? 'none' : 'flex';
  const categorySelect = document.getElementById('category');
  if(newType==='income'){
    categorySelect.innerHTML = INCOME_CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('');
  }else{
    refreshCategoryOptions(categorySelect, 'Rent/Mortgage');
  }
}
document.getElementById('tabExpense').addEventListener('click', () => setEntryType('expense'));
document.getElementById('tabIncome').addEventListener('click', () => setEntryType('income'));

function openModal(){
  editingEntry = null;
  document.getElementById('monthPicker').value = (view==="detail" && activeMonth) ? activeMonth : currentMonthKey();
  document.getElementById('dayPicker').value = currentDay();
  document.getElementById('recurringCheck').checked = false;
  document.getElementById('amount').value = '';
  document.getElementById('note').value = '';
  setEntryType('expense');
  const acctSelect = document.getElementById('entryAccount');
  if(accounts.length === 0){
    acctSelect.innerHTML = `<option value="">No accounts yet — add one from the Accounts page</option>`;
  }else{
    acctSelect.innerHTML = accounts.map(a => `<option value="${a.id}">${escapeHtml(a.name)} (${a.type})</option>`).join('');
  }
  receiptInput.value=''; receiptPreview.src=''; receiptPreview.classList.remove('show'); setReceiptStatus('');
  backdrop.classList.add('open');
  document.getElementById('amount').focus();
}

function openEditModal(type, entry){
  editingEntry = { type, id: entry.id };
  setEntryType(type);

  const acctSelect = document.getElementById('entryAccount');
  if(accounts.length === 0){
    acctSelect.innerHTML = `<option value="">No accounts yet — add one from the Accounts page</option>`;
  }else{
    acctSelect.innerHTML = accounts.map(a => `<option value="${a.id}">${escapeHtml(a.name)} (${a.type})</option>`).join('');
  }

  document.getElementById('amount').value = entry.amount;
  document.getElementById('category').value = entry.category;
  document.getElementById('monthPicker').value = entry.date.slice(0,7);
  document.getElementById('dayPicker').value = parseInt(entry.date.slice(8,10),10);
  document.getElementById('note').value = entry.note || '';
  if(entry.accountId) acctSelect.value = entry.accountId;
  document.getElementById('recurringCheck').checked = false;

  backdrop.classList.add('open');
  document.getElementById('amount').focus();
}

function closeModal(){
  backdrop.classList.remove('open'); entryForm.reset();
  editingEntry = null;
  receiptInput.value=''; receiptPreview.src=''; receiptPreview.classList.remove('show'); setReceiptStatus('');
}
fabAdd.addEventListener('click', openModal);
cancelBtn.addEventListener('click', closeModal);
scanReceiptBtn.addEventListener('click', () => receiptInput.click());
receiptInput.addEventListener('change', () => { const file=receiptInput.files && receiptInput.files[0]; scanReceipt(file); });
backdrop.addEventListener('click', (e) => { if(e.target === backdrop) closeModal(); });

entryForm.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const amount = parseFloat(document.getElementById('amount').value);
  if(!amount || amount <= 0) return;
  const monthVal = document.getElementById('monthPicker').value;
  if(!monthVal) return;
  let day = parseInt(document.getElementById('dayPicker').value,10);
  if(!day || day<1) day=1; if(day>31) day=31;
  const category = document.getElementById('category').value;
  const note = document.getElementById('note').value.trim();
  const isRecurring = entryType==='expense' && !editingEntry && document.getElementById('recurringCheck').checked;
  const date = `${monthVal}-${pad2(day)}`;
  const accountId = document.getElementById('entryAccount').value || null;

  addSubmitBtn.disabled = true;
  try{
    if(editingEntry){
      const table = editingEntry.type === 'income' ? 'income_entries' : 'expenses';
      const { error } = await sb.from(table).update({ amount, category, note, date, account_id: accountId }).eq('id', editingEntry.id);
      if(error) throw error;
      const arr = editingEntry.type === 'income' ? incomeEntries : expenses;
      const item = arr.find(x => x.id === editingEntry.id);
      if(item){ item.amount=amount; item.category=category; item.note=note; item.date=date; item.accountId=accountId; }
    }else if(entryType === 'income'){
      const { data, error } = await sb.from('income_entries').insert({
        user_id: currentUser.id, amount, category, note, date, account_id: accountId
      }).select().single();
      if(error) throw error;
      incomeEntries.push({ id:data.id, amount, category, note, date, accountId });
    }else if(isRecurring){
      const { data, error } = await sb.from('recurring_templates').insert({
        user_id: currentUser.id, amount, category, note, day, start_month: monthVal, skipped_months: [], account_id: accountId
      }).select().single();
      if(error) throw error;
      recurringTemplates.push({ id:data.id, amount, category, note, day, startMonth:monthVal, skippedMonths:[], accountId });
      const newOnes = generateRecurringEntries();
      if(newOnes.length) await insertGeneratedEntries(newOnes);
    }else{
      const { data, error } = await sb.from('expenses').insert({
        user_id: currentUser.id, amount, category, note, date, account_id: accountId
      }).select().single();
      if(error) throw error;
      expenses.push({ id:data.id, amount, category, note, date, accountId });
    }
    activeMonth = monthVal;
    view = "detail";
    render();
    closeModal();
  }catch(err){
    alert(err.message || 'Could not save that entry. Try again.');
  }finally{
    addSubmitBtn.disabled = false;
  }
});

boot();
</script>
